<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Futebol de Respeito · A pelada de domingo</title>
<meta name="description" content="Lista da pelada, pagamentos e sorteio de times. Entra, paga, joga." />
<meta name="theme-color" content="#0B3D24" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icon.png" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />

<meta property="og:type" content="website" />
<meta property="og:title" content="Futebol de Respeito" />
<meta property="og:description" content="Entra na lista, paga a sua parte e vê os times. Domingo é domingo." />
<meta property="og:image" content="https://futebolderespeito.vercel.app/og.png" />
<meta property="og:url" content="https://futebolderespeito.vercel.app" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
:root{
  --bg:#0B3D24; --bg-2:#0F5A34; --bg-3:#052616; --bg-soft:#137A44;
  --ink:#0A2617; --dim:#5E7267; --faint:#8A9D92;
  --card:#FFFFFF; --soft:#F2F6F3; --soft-2:#E7EEE9; --line:rgba(10,38,23,.09);
  --gold:#FFCC00; --gold-deep:#E0A800; --blue:#0057B8; --mint:#00C853; --amber:#FF7A1A;
  --red:#D6293E; --red-deep:#8C0F20;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:28px;
  --r-lg:18px; --r-md:12px; --r-sm:9px;
  --ease:cubic-bezier(.4,0,.2,1);
  --shadow:0 1px 2px rgba(10,38,23,.10), 0 6px 16px rgba(10,38,23,.08);
  --shadow-lg:0 2px 6px rgba(10,38,23,.14), 0 18px 40px rgba(10,38,23,.16);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); min-height:100dvh;
  font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-feature-settings:"cv11","ss01";
  padding:env(safe-area-inset-top) 0 calc(var(--s6) + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 60% at 50% -10%, rgba(255,255,255,.10), transparent 60%);
}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 var(--s4);
  display:flex;flex-direction:column;gap:var(--s3)}
.disp{font-family:Archivo,system-ui,sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1}
.lbl{font-family:Archivo,system-ui,sans-serif;font-size:10.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.13em}

/* ---------- cartões ---------- */
.card{background:var(--card);border-radius:var(--r-lg);padding:var(--s5);box-shadow:var(--shadow);
  animation:rise .5s var(--ease) both}
.card.editable{box-shadow:var(--shadow),inset 3px 0 0 var(--amber)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s4)}
.card-t{color:var(--bg)}
.card-n{color:var(--faint)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- faixa do organizador ---------- */
.ob{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
  gap:var(--s3);background:var(--blue);color:#fff;border-radius:999px;padding:9px 8px 9px 16px;
  margin-bottom:2px;box-shadow:var(--shadow-lg);animation:rise .4s var(--ease) both}
.ob b{font-family:Archivo,system-ui,sans-serif;font-size:11px;font-weight:800;letter-spacing:.05em}
.ob button{font-family:Archivo,system-ui,sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;background:rgba(255,255,255,.18);color:#fff;padding:8px 13px;border-radius:999px}
.ob button:active{background:rgba(255,255,255,.3)}

/* ---------- cartão do jogo ---------- */
.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);
  background:linear-gradient(155deg,var(--bg-soft) 0%,var(--bg-2) 45%,var(--bg-3) 100%);
  padding:var(--s6) var(--s5) var(--s5);box-shadow:var(--shadow-lg);
  animation:rise .5s var(--ease) both}
.hero::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--mint) 0 33.33%,var(--gold) 33.33% 66.66%,var(--blue) 66.66% 100%)}
.hero::after{content:"";position:absolute;width:280px;height:280px;right:-90px;top:-120px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,204,0,.16),transparent 68%);pointer-events:none}
.hero .pitch{position:absolute;inset:0;width:100%;height:100%;opacity:.1;pointer-events:none}
.hero-in{position:relative}
.brand{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s5)}
.brand b{font-family:Archivo,system-ui,sans-serif;font-size:12px;font-weight:800;color:#fff;
  letter-spacing:.16em;text-transform:uppercase}
.kick{display:flex;align-items:center;gap:var(--s4)}
.kick .dnum{font-size:66px;color:#fff;letter-spacing:-.04em}
.kick .dtxt{min-width:0}
.kick .d1{font-family:Archivo,system-ui,sans-serif;font-size:17px;font-weight:700;color:#fff;
  text-transform:uppercase;letter-spacing:.02em;line-height:1.15}
.kick .d2{font-size:12px;color:var(--gold);font-weight:600;margin-top:var(--s1);letter-spacing:.02em}
.hero-foot{display:flex;gap:var(--s2);margin-top:var(--s5);flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);
  border-radius:999px;padding:8px 14px;font-size:12px;color:#fff;text-decoration:none;font-weight:500;
  transition:background .18s var(--ease)}
.pill:active{background:rgba(255,255,255,.24)}
.pill.hot{background:var(--blue)}

/* ---------- botões ---------- */
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;
  font-family:Archivo,system-ui,sans-serif;padding:14px var(--s4);border-radius:var(--r-md);
  font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  transition:transform .18s var(--ease),filter .18s var(--ease),opacity .18s var(--ease)}
.btn:active{transform:scale(.975);filter:brightness(.95)}
.btn:disabled{opacity:.32;cursor:default;transform:none}
.btn-1{background:var(--gold);color:var(--ink)}
.btn-2{background:var(--bg);color:#fff}
.btn-g{background:var(--soft);color:var(--bg)}
.btn-s{width:auto;padding:10px var(--s4);font-size:11px;border-radius:var(--r-sm)}

/* ---------- inputs ---------- */
input{font:inherit;width:100%;background:var(--soft);border:1.5px solid transparent;color:var(--ink);
  border-radius:var(--r-md);padding:13px var(--s3);outline:none;
  transition:border-color .18s var(--ease),background .18s var(--ease)}
input:focus{border-color:var(--bg);background:#fff}
input::placeholder{color:var(--faint)}
label{display:block;color:var(--bg);margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.field+.field,.grid2+.field,.field+.grid2,.grid2+.grid2{margin-top:var(--s3)}
.inline{display:flex;gap:var(--s2)}

/* ---------- info somente leitura (não-organizador) ---------- */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.info-item{background:var(--soft);border-radius:var(--r-md);padding:11px var(--s3)}
.info-item .k{color:var(--faint)}
.info-item .v{font-size:14px;font-weight:600;margin-top:3px;letter-spacing:-.01em}

/* ---------- sua vaga ---------- */
.me-in{display:flex;align-items:center;gap:var(--s3)}
.me-badge{width:48px;height:48px;border-radius:var(--r-md);background:var(--bg);color:var(--gold);
  display:grid;place-items:center;flex:none;font-size:16px}
.me-txt{flex:1;min-width:0}
.me-txt b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.me-txt span{font-size:12.5px;color:var(--dim)}

/* ---------- lista ---------- */
.sec{color:var(--faint);margin:var(--s5) 0 var(--s2);display:flex;align-items:center;gap:var(--s2)}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.row{display:flex;align-items:center;gap:9px;padding:10px;border-radius:var(--r-sm);
  background:var(--soft);border-left:3px solid transparent;
  transition:background .18s var(--ease);animation:slide .35s var(--ease) both}
.row+.row{margin-top:var(--s1)}
.row.mine{border-left-color:var(--blue);background:rgba(0,87,184,.055)}
.row.sub{opacity:.62}
@keyframes slide{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.num{width:24px;height:24px;border-radius:7px;background:var(--soft-2);color:var(--bg);flex:none;
  display:grid;place-items:center;font-size:11.5px;font-family:Archivo,sans-serif;font-weight:700}
.row.mine .num{background:var(--blue);color:#fff}
.nm{flex:1;min-width:0;font-size:14.5px;font-weight:500;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm i{font-style:normal;color:var(--blue);font-size:9px;font-weight:800;margin-left:7px;
  letter-spacing:.12em;font-family:Archivo,sans-serif;vertical-align:1px}
.tag{font-family:Archivo,system-ui,sans-serif;font-size:9.5px;font-weight:700;padding:6px 9px;
  border-radius:6px;flex:none;text-transform:uppercase;letter-spacing:.09em;
  transition:transform .18s var(--ease)}
.tag:active{transform:scale(.93)}
.tag-ok{background:var(--gold);color:var(--ink)}
.tag-no{background:var(--soft-2);color:var(--dim)}
.row.mine .tag-no{background:var(--blue);color:#fff}
.x{width:24px;height:24px;border-radius:6px;color:var(--faint);flex:none;font-size:13px;
  transition:color .18s var(--ease),background .18s var(--ease)}
.x:active{background:rgba(0,87,184,.14);color:var(--blue)}
.x.ok{color:var(--gold-deep)}
.x.ok:active{background:rgba(224,168,0,.18);color:var(--gold-deep)}
.empty{text-align:center;color:var(--faint);font-size:13.5px;padding:var(--s6) 0;line-height:1.6}

/* ---------- pagamentos ---------- */
.bar{height:8px;border-radius:999px;background:var(--soft-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--gold-deep),var(--gold));
  transition:width .7s var(--ease)}
.money{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:var(--s3);gap:var(--s3)}
.money .big{font-size:36px;color:var(--bg)}
.money .cap{font-size:12.5px;color:var(--dim);margin-top:3px}
.money .side{font-size:12.5px;color:var(--dim);text-align:right;line-height:1.35}
.money .side b{display:block;font-size:16px;color:var(--ink);font-weight:600}
.copyrow{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);background:var(--soft);
  border-radius:var(--r-md);padding:12px var(--s3);transition:background .18s var(--ease)}
.copyrow+.copyrow{margin-top:var(--s2)}
.copyrow .k{color:var(--faint)}
.copyrow .v{font-size:13.5px;font-weight:600;margin-top:3px;letter-spacing:-.01em}

/* ---------- times ---------- */
.teams{display:grid;gap:var(--s3)}
@media(min-width:520px){.teams{grid-template-columns:repeat(3,1fr)}}
.team{border-radius:var(--r-md);padding:var(--s4);background:var(--soft);
  border-top:4px solid var(--kit,var(--bg));animation:pop .45s var(--ease) both}
.team:nth-child(2){animation-delay:.07s}
.team:nth-child(3){animation-delay:.14s}
.team-h{display:flex;align-items:center;gap:var(--s2);padding-bottom:10px;margin-bottom:10px;
  border-bottom:1px solid var(--line)}
.shirt{width:20px;height:20px;flex:none}
.team-h b{font-family:Archivo,system-ui,sans-serif;font-size:11px;font-weight:800;
  letter-spacing:.11em;text-transform:uppercase;color:var(--bg)}
.team p{font-size:13.5px;padding:5px 0;font-weight:500;letter-spacing:-.01em}
.team p+p{border-top:1px solid rgba(10,38,23,.06)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.rolling .team{animation:none}

/* ---------- organização ---------- */
details.org summary{list-style:none;cursor:pointer;display:flex;align-items:center;
  justify-content:space-between;color:var(--bg)}
details.org summary::-webkit-details-marker{display:none}
details.org[open] summary{margin-bottom:var(--s4)}
details.org summary::after{content:"\25BE";transition:transform .25s var(--ease);font-size:11px}
details.org[open] summary::after{transform:rotate(180deg)}

.note{font-size:13px;color:var(--ink);background:var(--card);border-left:4px solid var(--blue);
  border-radius:var(--r-md);padding:13px var(--s4);line-height:1.5;box-shadow:var(--shadow);
  animation:rise .5s var(--ease) both}
.note code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
  background:var(--soft-2);padding:2px 6px;border-radius:5px}

/* ---------- aviso de pagamento pendente ---------- */
.pay-alert{background:linear-gradient(155deg,var(--red) 0%,var(--red-deep) 100%);
  border-radius:var(--r-lg);padding:var(--s4) var(--s5);color:#fff;text-align:center;
  box-shadow:var(--shadow-lg);animation:rise .5s var(--ease) both, pulse 2.2s ease-in-out infinite}
.pay-alert .pa-head{font-family:Archivo,system-ui,sans-serif;font-weight:800;font-size:15px;
  letter-spacing:.03em;text-transform:uppercase}
.pay-alert .pa-body{font-size:13px;margin-top:6px;line-height:1.5;opacity:.95}
@keyframes pulse{0%,100%{box-shadow:var(--shadow-lg)}50%{box-shadow:0 0 0 7px rgba(214,41,62,.22),var(--shadow-lg)}}
.foot{text-align:center;padding:var(--s2) 0 var(--s2);display:flex;flex-direction:column;
  align-items:center;gap:6px}
.foot .status{font-size:10.5px;color:rgba(255,255,255,.62);text-transform:uppercase;
  letter-spacing:.13em;font-weight:600}
.foot .gestor{font-size:11.5px;color:rgba(255,255,255,.38);text-decoration:underline;
  text-underline-offset:3px;font-weight:500}
.foot .gestor:active{color:rgba(255,255,255,.7)}
.live{display:inline-flex;align-items:center;gap:7px}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);
  animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bg);
  color:#fff;font-family:Archivo,system-ui,sans-serif;font-size:11.5px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;padding:13px 22px;border-radius:999px;z-index:9;
  animation:up .3s var(--ease) both;box-shadow:var(--shadow-lg);max-width:88vw;text-align:center}
@keyframes up{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
.boot{display:grid;place-items:center;min-height:70dvh;color:rgba(255,255,255,.55);font-size:13px}

/* ---------- modal do organizador ---------- */
.overlay{position:fixed;inset:0;background:rgba(5,20,12,.55);backdrop-filter:blur(2px);
  display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:0;
  animation:fade .2s var(--ease) both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(min-width:480px){.overlay{align-items:center;padding:var(--s4)}}
.modal{background:var(--card);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:var(--s5);
  width:100%;max-width:400px;box-shadow:var(--shadow-lg);animation:sheet .28s var(--ease) both}
@media(min-width:480px){.modal{border-radius:var(--r-lg)}}
@keyframes sheet{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s4)}
.modal-h b{font-family:Archivo,system-ui,sans-serif;font-size:15px;font-weight:800;color:var(--bg);
  text-transform:uppercase;letter-spacing:.04em}
.modal-close{width:30px;height:30px;border-radius:8px;color:var(--faint);font-size:16px;flex:none}
.modal-close:active{background:var(--soft)}
.modal-err{font-size:12.5px;color:var(--blue);font-weight:600;margin-top:var(--s2)}
.modal-hint{font-size:12px;color:var(--faint);margin-top:var(--s3);line-height:1.5}

/* telemóveis estreitos: aperta as margens para o nome não ser cortado */
@media (max-width:400px){
  .wrap{padding:0 12px}
  .card{padding:var(--s4)}
  .hero{padding:var(--s5) var(--s4) var(--s4)}
  .kick .dnum{font-size:58px}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-delay:0 !important;
    transition-duration:.001ms !important}
}
</style>
</head>
<body>
<div id="app"><div class="boot">Carregando a pelada…</div></div>

<script type="module">
import { h, render } from "https://esm.sh/preact@10.19.6";
import { useState, useEffect, useRef, useCallback } from "https://esm.sh/preact@10.19.6/hooks";
import htm from "https://esm.sh/htm@3.1.1";

const html = htm.bind(h);

/* ============================================================
   CONFIGURAÇÃO
   Muda aqui os dados do grupo. Os dois primeiros valores ligam
   o app ao Supabase (Project Settings > API).
   ============================================================ */
const SUPABASE_URL = "https://fvdlajeblaqifjtyezvn.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Qmj4oO4GqM_nA6OxjFqnOA_C67pKCZ0";

const MAPS_LINK = "https://maps.app.goo.gl/aCSuyV77kXDmsYV47?g_st=ic";
const CAMPO = "Ver o campo no mapa";
// Edge Functions do Supabase — confirmam pagamento de verdade via
// Stripe (ver supabase/functions/). SUPABASE_URL já vem de cima.
const EDGE_BASE = `${SUPABASE_URL}/functions/v1`;

const DEFAULTS = { kickoff: "10:00", slots: 15, price: 5, price_mensal: 15 };
const ME_KEY = "fdr:me";
const LOCAL_KEY = "fdr:local";
// Guarda nome+token enquanto a pessoa está no Stripe, já que a
// navegação de ida e volta perde qualquer estado do React.
const STRIPE_PENDING_KEY = "fdr:stripe_pending";
// Token de mensalista — ao contrário de ME_KEY (que é por jogo, reseta
// toda semana), este é permanente: prova, todo domingo, que é mesmo
// essa pessoa sem precisar digitar nome nem pagar de novo.
const MEMBER_KEY = "fdr:mensalista";

const configured = SUPABASE_URL !== "COLOCAR_AQUI" && SUPABASE_ANON_KEY !== "COLOCAR_AQUI";

// color = cor da camisa, edge = cor da barra do cartão. Separadas porque
// a camisa branca precisa ser branca, mas uma barra branca em cima de
// cartão claro não aparece.
const KITS = [
  { name: "Coletes", color: "#0057B8", edge: "#0057B8" },
  { name: "Brancos", color: "#FFFFFF", edge: "#00C853" },
  { name: "Pretos", color: "#0A2617", edge: "#0A2617" },
];

/* ---------------- datas ---------------- */
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const today = () => iso(new Date());

function nextSunday(from) {
  const d = from ? new Date(from + "T00:00:00") : new Date();
  const base = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const add = (7 - base.getDay()) % 7;
  base.setDate(base.getDate() + (from ? add || 7 : add));
  return iso(base);
}

const fmt = (d, o) => new Date(d + "T00:00:00").toLocaleDateString("pt-BR", o);
const longDate = (d) => fmt(d, { weekday: "long", day: "numeric", month: "long" });
const weekday = (d) => fmt(d, { weekday: "long" });
const monthName = (d) => fmt(d, { month: "long" });
const dayNum = (d) => new Date(d + "T00:00:00").getDate();

function daysAway(d) {
  const a = new Date(today() + "T00:00:00");
  const b = new Date(d + "T00:00:00");
  return Math.round((b - a) / 86400000);
}
function countdown(d) {
  const n = daysAway(d);
  if (n < 0) return "já passou";
  if (n === 0) return "é hoje";
  if (n === 1) return "é amanhã";
  return `faltam ${n} dias`;
}

const eur = (n) => `${Number(n || 0).toFixed(2).replace(".", ",").replace(",00", "")}€`;
const uuid = () => crypto.randomUUID();

// Soma 1 mês a uma data "YYYY-MM-DD". Usado pra renovar mensalidade —
// mesma lógica das Edge Functions (supabase/functions/stripe-*).
function addOneMonth(isoDate) {
  const d = new Date(isoDate + "T00:00:00Z");
  d.setUTCMonth(d.getUTCMonth() + 1);
  return d.toISOString().slice(0, 10);
}

// Sexta-feira antes do jogo (que é sempre domingo) — prazo informal
// pra pagar antes que o organizador possa liberar a vaga pra outra
// pessoa.
function fridayBefore(gameDateISO) {
  const d = new Date(gameDateISO + "T23:59:59");
  d.setDate(d.getDate() - 2);
  return d;
}

function avisoPagamento(gameDateISO) {
  const friday = fridayBefore(gameDateISO);
  const n = daysAway(iso(friday));
  if (n > 1) return { corpo: `Faltam ${n} dias até sexta. Depois disso o organizador pode tirar seu nome da lista pra abrir vaga pra quem tá esperando.` };
  if (n === 1) return { corpo: "Amanhã é sexta. Não deixa pra última hora — sua vaga não tá garantida." };
  if (n === 0) return { corpo: "HOJE é o prazo. Paga agora ou corre o risco de sair da lista." };
  return { corpo: "Já passou da sexta e você ainda não pagou. Pode ser tirado da lista a qualquer momento." };
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function initials(name) {
  const p = name.trim().split(/\s+/);
  return ((p[0] || "")[0] + (p.length > 1 ? p[p.length - 1][0] : "")).toUpperCase();
}

/* ============================================================
   CAMADA DE DADOS
   Duas implementações com a mesma interface. Jogadores nunca
   criam conta — entram e saem pelas funções join_game/leave_game
   (token no celular). Os 2 organizadores logam com email + senha
   (Supabase Auth); as ações deles só funcionam com sessão porque
   as regras do banco (RLS) exigem "authenticated", não porque
   este arquivo decide.

   store.live      : true só no Supabase
   store.auth      : só existe no remoteStore — signIn/signOut/
                     onChange/user, pros 2 organizadores
   store.adminXxx  : ações de organizador; no modo local (sem
                     Supabase) qualquer um é organizador, porque
                     é um telemóvel só
   ============================================================ */
function localStore() {
  const read = () => {
    try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || {}; } catch { return {}; }
  };
  const write = (s) => { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(s)); } catch {} };

  return {
    live: false,
    async currentGame() {
      const s = read();
      if (s.game && s.game.game_date >= today()) return s.game;
      const game = { game_date: nextSunday(), ...DEFAULTS, teams: null };
      write({ ...s, game, players: s.game ? [] : s.players || [] });
      return game;
    },
    async players() {
      return read().players || [];
    },
    async addPlayer(date, name) {
      const s = read();
      const row = { id: `l${Date.now()}${Math.random().toString(16).slice(2, 6)}`, name, paid: false, paid_at: null };
      s.players = [...(s.players || []), row];
      write(s);
      return row;
    },
    async removePlayer(id) {
      const s = read();
      s.players = (s.players || []).filter((p) => p.id !== id);
      write(s);
      return true;
    },
    // members não reseta junto com o jogo — mensalidade sobrevive à
    // troca de domingo, só players reseta.
    async members() {
      return read().members || [];
    },
    async confirmPresenceByToken(date, token) {
      const s = read();
      const m = (s.members || []).find((x) => x.token === token);
      if (!m || m.valid_until < today()) return null;
      const key = m.name.trim().toLowerCase();
      let row = (s.players || []).find((p) => p.name.trim().toLowerCase() === key);
      if (!row) {
        row = { id: `l${Date.now()}${Math.random().toString(16).slice(2, 6)}`, name: m.name, paid: true, paid_at: new Date().toISOString(), source: "mensalista" };
        s.players = [...(s.players || []), row];
      } else if (!row.paid) {
        row = { ...row, paid: true, paid_at: new Date().toISOString(), source: "mensalista" };
        s.players = s.players.map((p) => (p.id === row.id ? row : p));
      }
      write(s);
      return row;
    },
    async claimMembership(name, token) {
      const s = read();
      const key = name.trim().toLowerCase();
      const m = (s.members || []).find((x) => x.name.trim().toLowerCase() === key && !x.token);
      if (!m) return null;
      s.members = s.members.map((x) => (x.id === m.id ? { ...x, token } : x));
      write(s);
      return m.id;
    },
    // Modo local não tem Stripe de verdade — "virar mensalista" cria
    // ou renova o member direto, sem pagamento nenhum (igual todo o
    // resto do modo local, que já não tem gate de pagamento real).
    async becomeMemberLocally(name, token) {
      const s = read();
      const key = name.trim().toLowerCase();
      let m = (s.members || []).find((x) => x.name.trim().toLowerCase() === key);
      const base = m && m.valid_until > today() ? m.valid_until : today();
      const valid_until = addOneMonth(base);
      if (m) {
        s.members = s.members.map((x) => (x.id === m.id ? { ...x, token, valid_until } : x));
      } else {
        m = { id: `m${Date.now()}${Math.random().toString(16).slice(2, 6)}`, name, token, valid_until };
        s.members = [...(s.members || []), m];
      }
      write(s);
      return m;
    },
    subscribe() { return () => {}; },
    // No modo local (sem Supabase) é um telemóvel só: quem abre já
    // controla tudo, não existe conceito de organizador nem de login.
    async adminSetPaid(id, paid) {
      const s = read();
      const paid_at = paid ? new Date().toISOString() : null;
      s.players = (s.players || []).map((p) => (p.id === id ? { ...p, paid, paid_at } : p));
      write(s);
      return true;
    },
    async adminRemovePlayer(id) { return this.removePlayer(id); },
    // Organizador cadastra alguém que não paga pelo app (dinheiro na
    // mão, PIX por fora etc.) — entra direto como confirmado.
    async adminAddPlayer(date, name) {
      const s = read();
      const row = { id: `l${Date.now()}${Math.random().toString(16).slice(2, 6)}`, name, paid: true, paid_at: new Date().toISOString() };
      s.players = [...(s.players || []), row];
      write(s);
      return row;
    },
    // Mensalista cadastrado pelo organizador (pagou por fora) — sem
    // token ainda, a própria pessoa reivindica depois (claimMembership).
    async adminAddMember(name, validUntil) {
      const s = read();
      const key = name.trim().toLowerCase();
      if ((s.members || []).some((m) => m.name.trim().toLowerCase() === key)) return null;
      const row = { id: `m${Date.now()}${Math.random().toString(16).slice(2, 6)}`, name, token: null, valid_until: validUntil || today() };
      s.members = [...(s.members || []), row];
      write(s);
      return row;
    },
    async adminRenewMember(id, currentValidUntil) {
      const s = read();
      const base = currentValidUntil > today() ? currentValidUntil : today();
      const valid_until = addOneMonth(base);
      s.members = (s.members || []).map((m) => (m.id === id ? { ...m, valid_until } : m));
      write(s);
      return valid_until;
    },
    async adminRemoveMember(id) {
      const s = read();
      s.members = (s.members || []).filter((m) => m.id !== id);
      write(s);
      return true;
    },
    async adminResetMemberToken(id) {
      const s = read();
      s.members = (s.members || []).map((m) => (m.id === id ? { ...m, token: null } : m));
      write(s);
      return true;
    },
    async adminOpenGame(patch) {
      const s = read();
      const game = { ...DEFAULTS, ...patch, game_date: patch.game_date || nextSunday(), teams: null };
      write({ ...s, game, players: [] });
      return game;
    },
    async adminUpdateGame(date, patch) {
      const s = read();
      const game = { ...(s.game || {}), ...patch, teams: null };
      write({ ...s, game });
      return game;
    },
    async adminSetTeams(date, teams) {
      const s = read();
      const game = { ...(s.game || {}), teams };
      write({ ...s, game });
      return game;
    },
  };
}

async function remoteStore() {
  // v2 recente: as chaves novas (sb_publishable_...) não são JWT, e as
  // versões antigas do cliente não lidam bem com elas.
  const { createClient } = await import("https://esm.sh/@supabase/supabase-js@2");
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Verifica que as tabelas existem antes de assumir o Supabase. Sem isto,
  // com o schema.sql por rodar, o app parecia funcionar mas não gravava
  // nada: cada gesto dava erro em silêncio e a lista sumia ao recarregar.
  const { error: semTabelas } = await sb.from("games").select("game_date").limit(1);
  if (semTabelas) throw new Error(`Supabase sem as tabelas (${semTabelas.message}). Roda o supabase/schema.sql.`);

  return {
    live: true,
    // auth: só existe no remoteStore. Os jogadores nunca tocam nisto —
    // é só pros 2 organizadores, que logam com email + senha (contas
    // criadas no painel do Supabase, ver o final do schema.sql).
    auth: {
      async user() {
        const { data } = await sb.auth.getUser();
        return data && data.user ? data.user : null;
      },
      async signIn(email, password) {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        return { error };
      },
      async signOut() {
        await sb.auth.signOut();
      },
      onChange(cb) {
        const { data } = sb.auth.onAuthStateChange((_ev, session) => cb(session ? session.user : null));
        return () => data.subscription.unsubscribe();
      },
    },
    async currentGame() {
      const { data } = await sb.from("games").select("*").gte("game_date", today())
        .order("game_date", { ascending: true }).limit(1);
      return data && data.length ? data[0] : null;
    },
    async players(date) {
      const { data, error } = await sb.from("players").select("*").eq("game_date", date)
        .order("created_at", { ascending: true });
      if (error) { console.error(error); return []; }
      return data.map((r) => ({ id: r.id, name: r.name, paid: r.paid, paid_at: r.paid_at, source: r.source }));
    },
    async members() {
      const { data, error } = await sb.from("members").select("*");
      if (error) { console.error(error); return []; }
      return data;
    },
    // Chamada toda vez que o app abre, se o celular já tem um token de
    // mensalista guardado — confirma presença na semana sem pagar de
    // novo. Null se a mensalidade não existir mais ou tiver vencido.
    async confirmPresenceByToken(date, token) {
      const { data, error } = await sb.rpc("confirm_presence_by_token", { p_date: date, p_token: token });
      if (error) return null;
      return data;
    },
    // Reivindica, uma única vez, um mensalista cadastrado pelo
    // organizador (pagou por fora, ainda sem token vinculado).
    async claimMembership(name, token) {
      const { data, error } = await sb.rpc("claim_membership", { p_name: name, p_token: token });
      if (error) { console.error(error); return null; }
      return data;
    },
    // Sem conta: entra pela função join_game, que dá um token — é esse
    // token que depois prova, sem senha nenhuma, que o próprio celular
    // pode tirar essa vaga de volta.
    async addPlayer(date, name, token) {
      const { data, error } = await sb.rpc("join_game", { p_date: date, p_name: name, p_token: token });
      if (error) { console.error(error); return null; }
      return { id: data, name, paid: false, paid_at: null };
    },
    async removePlayer(id, token) {
      const { data, error } = await sb.rpc("leave_game", { p_id: id, p_token: token });
      if (error) { console.error(error); return false; }
      return !!data;
    },
    subscribe(date, onChange) {
      const ch = sb.channel(`fdr-${date}`)
        .on("postgres_changes", { event: "*", schema: "public", table: "players", filter: `game_date=eq.${date}` }, onChange)
        .on("postgres_changes", { event: "*", schema: "public", table: "games" }, onChange)
        .on("postgres_changes", { event: "*", schema: "public", table: "members" }, onChange)
        .subscribe();
      return () => sb.removeChannel(ch);
    },
    // Tudo daqui pra baixo só funciona logado — a política do banco
    // (RLS "to authenticated") recusa sem sessão, não é este código
    // que decide.
    async adminSetPaid(id, paid) {
      const paid_at = paid ? new Date().toISOString() : null;
      const { error } = await sb.from("players").update({ paid, paid_at }).eq("id", id);
      if (error) { console.error(error); return false; }
      return true;
    },
    async adminRemovePlayer(id) {
      const { error } = await sb.from("players").delete().eq("id", id);
      if (error) { console.error(error); return false; }
      return true;
    },
    // Organizador cadastra alguém que não paga pelo app (dinheiro na
    // mão, PIX por fora etc.) — entra direto como confirmado, sem
    // passar pelo Stripe. Só funciona logado (RLS).
    async adminAddPlayer(date, name) {
      const { data, error } = await sb.from("players")
        .insert({ game_date: date, name, paid: true, paid_at: new Date().toISOString() })
        .select().single();
      if (error) { console.error(error); return null; }
      return { id: data.id, name: data.name, paid: data.paid, paid_at: data.paid_at };
    },
    // Mensalista cadastrado pelo organizador (pagou por fora) — sem
    // token ainda, a própria pessoa reivindica no celular dela depois
    // (claimMembership). Só funciona logado (RLS).
    async adminAddMember(name, validUntil) {
      const { data, error } = await sb.from("members")
        .insert({ name, valid_until: validUntil || today() })
        .select().single();
      if (error) { console.error(error); return null; }
      return data;
    },
    async adminRenewMember(id, currentValidUntil) {
      const base = currentValidUntil > today() ? currentValidUntil : today();
      const valid_until = addOneMonth(base);
      const { error } = await sb.from("members").update({ valid_until, updated_at: new Date().toISOString() }).eq("id", id);
      if (error) { console.error(error); return null; }
      return valid_until;
    },
    async adminRemoveMember(id) {
      const { error } = await sb.from("members").delete().eq("id", id);
      if (error) { console.error(error); return false; }
      return true;
    },
    async adminResetMemberToken(id) {
      const { error } = await sb.from("members").update({ token: null, updated_at: new Date().toISOString() }).eq("id", id);
      if (error) { console.error(error); return false; }
      return true;
    },
    async adminOpenGame(patch) {
      const row = {
        game_date: patch.game_date || nextSunday(),
        kickoff: patch.kickoff || DEFAULTS.kickoff,
        slots: patch.slots || DEFAULTS.slots,
        price: patch.price ?? DEFAULTS.price,
        price_mensal: patch.price_mensal ?? DEFAULTS.price_mensal,
        teams: null,
      };
      const { data, error } = await sb.from("games").upsert(row).select().single();
      if (error) { console.error(error); return null; }
      return data;
    },
    async adminUpdateGame(date, patch) {
      const { data, error } = await sb.from("games")
        .update({ ...patch, teams: null, updated_at: new Date().toISOString() })
        .eq("game_date", date).select().single();
      if (error) { console.error(error); return null; }
      return data;
    },
    async adminSetTeams(date, teams) {
      const { data, error } = await sb.from("games")
        .update({ teams, updated_at: new Date().toISOString() })
        .eq("game_date", date).select().single();
      if (error) { console.error(error); return null; }
      return data;
    },
  };
}

function App({ store }) {
  const [game, setGame] = useState(undefined); // undefined = carregando, null = sem jogo aberto
  const [players, setPlayers] = useState([]);
  const [members, setMembers] = useState([]);
  const [me, setMe] = useState(() => { try { return JSON.parse(localStorage.getItem(ME_KEY)); } catch { return null; } });
  const [meuMensalista, setMeuMensalista] = useState(() => { try { return JSON.parse(localStorage.getItem(MEMBER_KEY)); } catch { return null; } });
  const [user, setUser] = useState(null);
  const [loginOpen, setLoginOpen] = useState(false);
  const [loginErr, setLoginErr] = useState("");
  const [loginBusy, setLoginBusy] = useState(false);
  const [nome, setNome] = useState("");
  const [admNome, setAdmNome] = useState("");
  const [novoMensalista, setNovoMensalista] = useState("");
  const [step, setStep] = useState("nome"); // "nome" | "pagamento" — fluxo de Sua Vaga
  const [rolling, setRolling] = useState(false);
  const rollingRef = useRef(false);
  const [confirmState, setConfirmState] = useState(null);
  const [toast, setToast] = useState("");
  const [busy, setBusy] = useState(false);
  const [stripeBusy, setStripeBusy] = useState(false);
  const timer = useRef(null);

  // Só pra forçar a contagem regressiva do aviso de pagamento a
  // atualizar sozinha enquanto a pessoa fica com o app aberto.
  const [, setTick] = useState(0);
  useEffect(() => {
    const iv = setInterval(() => setTick((t) => t + 1), 60000);
    return () => clearInterval(iv);
  }, []);

  const isOrganizer = store.live ? !!user : true;

  const say = useCallback((m) => {
    setToast(m);
    clearTimeout(timer.current);
    timer.current = setTimeout(() => setToast(""), 1900);
  }, []);

  const refresh = useCallback(async (date) => {
    const rows = await store.players(date);
    setPlayers(rows);
  }, [store]);

  useEffect(() => {
    let alive = true;
    (async () => {
      const g = await store.currentGame();
      if (!alive) return;
      setGame(g);
      if (g) {
        const rows = await store.players(g.game_date);
        if (alive) setPlayers(rows);
      }
      const ms = await store.members();
      if (alive) setMembers(ms);
    })();
    return () => { alive = false; };
  }, [store]);

  // A sessão do organizador fica salva pelo próprio Supabase (dura
  // semanas) — só confirma no arranque se ainda tem alguém logado, e
  // fica escutando login/logout pra atualizar a tela na hora.
  useEffect(() => {
    if (!store.live || !store.auth) return;
    let alive = true;
    store.auth.user().then((u) => alive && setUser(u));
    const off = store.auth.onChange((u) => setUser(u));
    return () => { alive = false; off(); };
  }, [store]);

  // O Stripe manda a pessoa de volta pra cá com ?session_id=... na
  // URL depois do pagamento. Confere no servidor se foi pago de
  // verdade — o realtime (efeito abaixo) já cuida de atualizar a
  // lista sozinho assim que o banco mudar.
  useEffect(() => {
    if (!store.live) return;
    const params = new URLSearchParams(location.search);
    const sessionId = params.get("session_id");
    if (!sessionId) return;
    history.replaceState({}, "", location.pathname);
    (async () => {
      try {
        const resp = await fetch(`${EDGE_BASE}/stripe-verify-session`, {
          method: "POST",
          headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY },
          body: JSON.stringify({ session_id: sessionId }),
        });
        const data = await resp.json();
        if (data.ok) {
          say(data.plan === "mensal" ? "Mensalidade confirmada! Você já está na lista." : "Pagamento confirmado! Você já está na lista.");
          // Se foi este aparelho que iniciou uma entrada nova (não um
          // "Pagar agora" na vaga de outra pessoa), reconhece a vaga
          // como "sua vaga" aqui.
          let pendente = null;
          try { pendente = JSON.parse(localStorage.getItem(STRIPE_PENDING_KEY)); } catch {}
          if (pendente && data.player_id) {
            const novo = { id: data.player_id, name: pendente.name, token: pendente.token };
            localStorage.setItem(ME_KEY, JSON.stringify(novo));
            setMe(novo);
            if (pendente.plan === "mensal") {
              const mensalista = { token: pendente.token, name: pendente.name };
              localStorage.setItem(MEMBER_KEY, JSON.stringify(mensalista));
              setMeuMensalista(mensalista);
              store.members().then(setMembers);
            }
          }
          localStorage.removeItem(STRIPE_PENDING_KEY);
        } else {
          say("Não deu pra confirmar sozinho — fala com o organizador se já pagaste.");
        }
      } catch (e) {
        console.error(e);
        say("Não deu pra confirmar sozinho — fala com o organizador se já pagaste.");
      }
    })();
  }, [store]);

  useEffect(() => {
    if (!game) return;
    const off = store.subscribe(game.game_date, async () => {
      // Enquanto a animação do sorteio está rolando, o estado do time
      // muda localmente a cada instante — se um evento em tempo real
      // chegar nesse meio-tempo e sobrescrever o jogo, a animação trava
      // ou pisca. Ignora esses eventos até o sorteio terminar.
      if (rollingRef.current) return;
      const g = await store.currentGame();
      setGame(g);
      if (g) {
        const rows = await store.players(g.game_date);
        setPlayers(rows);
      }
      const ms = await store.members();
      setMembers(ms);
    });
    return off;
  }, [store, game && game.game_date]);

  // Mensalista NÃO entra sozinho — ele confirma que vai, um toque só,
  // sem pagar de novo (usa o token já guardado). Assim quem não vai
  // não fica marcado como presente, e a vaga fica livre pra outro.
  async function confirmarPresencaMensal() {
    if (!meuMensalista || busy) return;
    setBusy(true);
    const row = await store.confirmPresenceByToken(game.game_date, meuMensalista.token);
    setBusy(false);
    if (!row) return say("Não deu pra confirmar — sua mensalidade pode ter vencido");
    const novo = { id: row.id, name: row.name, token: meuMensalista.token };
    localStorage.setItem(ME_KEY, JSON.stringify(novo));
    setMe(novo);
    setPlayers((p) => (p.some((x) => x.id === row.id) ? p.map((x) => (x.id === row.id ? { ...x, ...row } : x)) : [...p, row]));
  }

  async function fazerLogin(email, password) {
    setLoginBusy(true);
    setLoginErr("");
    const { error } = await store.auth.signIn(email, password);
    setLoginBusy(false);
    if (error) return setLoginErr("Email ou senha incorretos");
    setLoginOpen(false);
    say("Login feito");
  }

  async function sairOrganizador() {
    await store.auth.signOut();
    say("Saiu do modo organizador");
  }

  // Substitui o confirm() do navegador — aquele popup cinza do sistema
  // que quebra a cara do app bem na hora mais delicada (tirar alguém
  // da lista, fechar a semana). Devolve uma Promise pra poder usar
  // "await askConfirm(...)" como se fosse o confirm() nativo.
  function askConfirm(message, confirmLabel) {
    return new Promise((resolve) => {
      setConfirmState({
        message, confirmLabel,
        onYes: () => { setConfirmState(null); resolve(true); },
        onNo: () => { setConfirmState(null); resolve(false); },
      });
    });
  }

  if (game === undefined) return html`<div class="boot">Carregando a pelada…</div>`;

  // Ninguém abriu o jogo ainda. Só o organizador consegue criar um.
  if (game === null) {
    return html`
      <div class="wrap">
        ${isOrganizer && store.live && html`
          <div class="ob"><b>Organizador · ${user.email}</b><button onClick=${sairOrganizador}>Sair</button></div>`}
        <div class="card" style="text-align:center;padding:36px 20px">
          <div class="card-t lbl" style="margin-bottom:10px">Sem jogo marcado</div>
          <div class="empty" style="padding:0 0 20px">
            ${isOrganizer
              ? "Abra a pelada de domingo que vem pra liberar a lista."
              : "Ainda não tem pelada marcada. Peça pro organizador abrir a próxima."}
          </div>
          ${isOrganizer && html`
            <button class="btn btn-1" onClick=${async () => {
              const g = await store.adminOpenGame({});
              if (g) { setGame(g); say("Jogo aberto"); } else say("Não deu pra abrir o jogo");
            }}>Abrir domingo, ${weekday(nextSunday())} que vem</button>`}
        </div>
        ${!isOrganizer && store.live && html`
          <button class="foot gestor" onClick=${() => setLoginOpen(true)}>Área do organizador</button>`}
      </div>
      ${loginOpen && h(LoginModal, { onClose: () => { setLoginOpen(false); setLoginErr(""); }, onSubmit: fazerLogin, err: loginErr, busy: loginBusy })}
      ${toast && html`<div class="toast">${toast}</div>`}
    `;
  }

  const slots = game.slots || DEFAULTS.slots;
  const price = Number(game.price ?? DEFAULTS.price);
  const priceMensal = Number(game.price_mensal ?? DEFAULTS.price_mensal);
  // Quem paga primeiro entra primeiro — por isso pagos ordena por
  // paid_at, não pela ordem em que os nomes chegaram (created_at).
  // Um simples .filter() preservaria a ordem de chegada por dentro,
  // o que anularia o incentivo de pagar cedo.
  const pagos = players.filter((p) => p.paid).sort((a, b) => new Date(a.paid_at) - new Date(b.paid_at));
  const pendentes = players.filter((p) => !p.paid);
  const titulares = pagos.slice(0, slots);
  const reservas = pagos.slice(slots);
  const pct = players.length ? Math.round((pagos.length / players.length) * 100) : 0;
  // Dinheiro arrecadado NESTA semana — mensalista não soma, já pagou
  // no mês, confirmar presença de graça não gera receita da semana.
  const avulsosPagos = pagos.filter((p) => p.source !== "mensalista").length;
  const avulsosTotal = players.filter((p) => p.source !== "mensalista").length;
  const myRow = me ? players.find((p) => p.id === me.id) : null;
  const myPaidIdx = myRow && myRow.paid ? pagos.findIndex((p) => p.id === me.id) : -1;
  const myPendingIdx = myRow && !myRow.paid ? pendentes.findIndex((p) => p.id === me.id) : -1;
  const souReserva = myPaidIdx >= slots;
  const lotado = titulares.length >= slots;

  // Já tem esse nome na lista? Não impede (pode ser mesmo dois "Lucas"
  // no grupo), só avisa — assim quem organiza sabe que precisa olhar o
  // sobrenome antes de marcar pago ou remover alguém.
  function jaExiste(n) {
    return players.some((p) => p.name.trim().toLowerCase() === n.toLowerCase());
  }

  // Mensalista ativo com esse nome (já com aparelho vinculado) — se
  // bater, a pessoa pula direto pra "confirmar presença", sem pagar.
  function mensalistaAtivo(n) {
    const key = n.trim().toLowerCase();
    return members.find((m) => m.token && m.name.trim().toLowerCase() === key && m.valid_until >= today());
  }
  // Mensalista cadastrado pelo organizador (pagou por fora), ainda sem
  // aparelho vinculado — a pessoa pode reivindicar digitando o nome.
  function mensalistaParaReivindicar(n) {
    const key = n.trim().toLowerCase();
    return members.find((m) => !m.token && m.name.trim().toLowerCase() === key);
  }
  const meuMembro = meuMensalista ? members.find((m) => m.token === meuMensalista.token) : null;
  const mensalidadeVencendo = meuMembro && daysAway(meuMembro.valid_until) <= 5;

  // Sem Supabase (modo local, um telemóvel só): não há pagamento de
  // verdade, então entra direto, como sempre — o organizador (o
  // próprio dono do telemóvel) confirma manualmente.
  // overrides.token existe só na renovação (reaproveita o token já
  // vinculado, pra somar 1 mês na mesma mensalidade em vez de criar
  // outra) — no primeiro pagamento como mensalista, nasce um token novo.
  async function pagarComStripe(plan = "avulso", overrides = {}) {
    const n = (overrides.name || nome).trim();
    if (!n || busy || stripeBusy) return;
    // Lotado bloqueia entrada nova avulsa — mensalista já pagou o mês,
    // continua conseguindo confirmar (entra como reserva se passar das
    // vagas, igual sempre funcionou pra quem paga primeiro).
    if (plan === "avulso" && lotado) return say("Já não há vagas — nem como reserva, não sobrou lugar nenhum.");

    if (!store.live) {
      setBusy(true);
      const tok = overrides.token || uuid();
      if (plan === "mensal") {
        await store.becomeMemberLocally(n, tok);
        const row = await store.confirmPresenceByToken(game.game_date, tok);
        setBusy(false);
        if (!row) return say("Não deu pra virar mensalista");
        const mensalista = { token: tok, name: n };
        localStorage.setItem(MEMBER_KEY, JSON.stringify(mensalista));
        setMeuMensalista(mensalista);
        const novo = { id: row.id, name: row.name, token: tok };
        localStorage.setItem(ME_KEY, JSON.stringify(novo));
        setMe(novo);
        setNome("");
        setStep("nome");
        setPlayers((p) => (p.some((x) => x.id === row.id) ? p.map((x) => (x.id === row.id ? row : x)) : [...p, row]));
        store.members().then(setMembers);
        return say(overrides.token ? "Mensalidade renovada!" : `${n} agora é mensalista!`);
      }
      const duplicado = jaExiste(n);
      const row = await store.addPlayer(game.game_date, n, tok);
      setBusy(false);
      if (!row) return say("Não deu pra entrar");
      const novo = { id: row.id, name: row.name, token: tok };
      localStorage.setItem(ME_KEY, JSON.stringify(novo));
      setMe(novo);
      setNome("");
      setStep("nome");
      setPlayers((p) => (p.some((x) => x.id === row.id) ? p : [...p, row]));
      return say(duplicado ? `Já tem um ${n} na lista — de olho pra não confundir` : "Falta o organizador confirmar seu pagamento");
    }

    // Com Supabase: a vaga NÃO é criada agora (avulso), nem o mês
    // contado (mensal) — só depois que o Stripe confirmar o pagamento
    // (stripe-verify-session / stripe-webhook). Quem desiste no meio do
    // caminho não deixa nome nenhum na lista, nem mensalidade cobrada.
    setStripeBusy(true);
    const tok = overrides.token || uuid();
    try {
      localStorage.setItem(STRIPE_PENDING_KEY, JSON.stringify({ name: n, token: tok, plan }));
      const resp = await fetch(`${EDGE_BASE}/stripe-create-session`, {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY },
        body: JSON.stringify({ name: n, game_date: game.game_date, token: tok, plan }),
      });
      const data = await resp.json();
      if (!resp.ok || !data.url) { setStripeBusy(false); return say(data.error || "Não deu pra abrir o pagamento"); }
      location.href = data.url;
    } catch (e) {
      console.error(e);
      setStripeBusy(false);
      say("Não deu pra abrir o pagamento");
    }
  }

  // Só pra mensalista cadastrado pelo organizador (pagou por fora,
  // sem token ainda) — a pessoa digita o próprio nome uma vez pra
  // vincular este aparelho, sem passar pelo Stripe.
  async function reivindicarMensalidade() {
    const n = nome.trim();
    if (!n || busy) return;
    setBusy(true);
    const tok = uuid();
    const id = await store.claimMembership(n, tok);
    setBusy(false);
    if (!id) return say("Não deu pra vincular — fala com o organizador");
    // Só vincula o aparelho — não entra na lista sozinho. A pessoa
    // confirma presença separado, um toque, quando quiser mesmo ir.
    const mensalista = { token: tok, name: n };
    localStorage.setItem(MEMBER_KEY, JSON.stringify(mensalista));
    setMeuMensalista(mensalista);
    setNome("");
    setStep("nome");
    store.members().then(setMembers);
    say(`Vinculado! Toca em "Vou jogar esse domingo" quando quiser confirmar.`);
  }

  // Botão "Pagar agora" numa vaga já pendente (ex.: alguém adicionado
  // por um amigo sem celular). A vaga já existe, só falta confirmar.
  async function pagarPendente(p) {
    setStripeBusy(true);
    try {
      const resp = await fetch(`${EDGE_BASE}/stripe-create-session`, {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY },
        body: JSON.stringify({ player_id: p.id }),
      });
      const data = await resp.json();
      if (!resp.ok || !data.url) { setStripeBusy(false); return say(data.error || "Não deu pra abrir o pagamento"); }
      location.href = data.url;
    } catch (e) {
      console.error(e);
      setStripeBusy(false);
      say("Não deu pra abrir o pagamento");
    }
  }

  async function togglePago(p) {
    if (!isOrganizer) return;
    const novo = !p.paid;
    const novoPaidAt = novo ? new Date().toISOString() : null;
    const paidAtAntigo = p.paid_at;
    setPlayers((l) => l.map((x) => (x.id === p.id ? { ...x, paid: novo, paid_at: novoPaidAt } : x)));
    const ok = await store.adminSetPaid(p.id, novo);
    if (!ok) {
      setPlayers((l) => l.map((x) => (x.id === p.id ? { ...x, paid: !novo, paid_at: paidAtAntigo } : x)));
      say("Não deu pra salvar");
    }
  }

  async function sair(p) {
    const souEu = me && me.id === p.id;
    if (!isOrganizer && !souEu) return;
    if (!(await askConfirm(`Tirar ${p.name} da lista?`, "Tirar"))) return;
    const ok = isOrganizer
      ? await store.adminRemovePlayer(p.id)
      : await store.removePlayer(p.id, me.token);
    if (!ok) return say("Não consegui remover");
    setPlayers((l) => l.filter((x) => x.id !== p.id));
    if (souEu) { localStorage.removeItem(ME_KEY); setMe(null); }
    if (isOrganizer) await store.adminSetTeams(game.game_date, null).then((g) => g && setGame(g));
  }

  // Organizador adiciona alguém que não paga pelo app (dinheiro na
  // mão, PIX por fora etc.) — entra já confirmado, marcado como pago.
  async function adminAdicionar() {
    const n = admNome.trim();
    if (!n || busy || !isOrganizer) return;
    if (lotado) return say("Já não há vagas — nem como reserva, não sobrou lugar nenhum.");
    const duplicado = jaExiste(n);
    setBusy(true);
    const row = await store.adminAddPlayer(game.game_date, n);
    setBusy(false);
    if (!row) return say("Não deu pra adicionar");
    setAdmNome("");
    setPlayers((p) => (p.some((x) => x.id === row.id) ? p : [...p, row]));
    say(duplicado ? `Já tem um ${n} na lista — de olho pra não confundir` : `${row.name} na lista, já como pago`);
  }

  function sortear() {
    if (!isOrganizer || titulares.length < 3 || rolling) return;
    rollingRef.current = true;
    setRolling(true);
    let t = 0;
    const iv = setInterval(async () => {
      t++;
      const s = shuffle(titulares.map((p) => p.name));
      const prev = [[], [], []];
      s.forEach((n, i) => prev[i % 3].push(n));
      if (t >= 11) {
        clearInterval(iv);
        const g = await store.adminSetTeams(game.game_date, prev);
        rollingRef.current = false;
        setRolling(false);
        if (g) setGame(g); else say("Não deu pra salvar o sorteio");
      } else {
        setGame((g) => ({ ...g, teams: prev }));
      }
    }, 85);
  }

  async function salvarOrganizacao(patch) {
    const g = await store.adminUpdateGame(game.game_date, patch);
    if (g) setGame(g); else say("Não deu pra salvar");
  }

  async function abrirProximoDomingo() {
    if (!(await askConfirm("Abrir o jogo do próximo domingo? A lista dele começa vazia.", "Abrir"))) return;
    // Valor por jogador é fixo (DEFAULTS.price) — não é mais editável,
    // não faz sentido herdar um valor antigo do jogo anterior.
    const g = await store.adminOpenGame({ game_date: nextSunday(game.game_date), kickoff: game.kickoff, slots, price: DEFAULTS.price, price_mensal: priceMensal });
    if (g) { setGame(g); refresh(g.game_date); say("Próximo domingo aberto"); } else say("Não deu pra abrir");
  }

  async function adicionarMensalista(n) {
    if (!n.trim() || busy) return;
    setBusy(true);
    const row = await store.adminAddMember(n.trim(), addOneMonth(today()));
    setBusy(false);
    if (!row) return say("Já existe um mensalista com esse nome");
    setMembers((m) => [...m, row]);
    setNovoMensalista("");
    say(`${n.trim()} adicionado como mensalista — falta só a pessoa vincular o aparelho dela`);
  }

  async function renovarMensalista(m) {
    const valid_until = await store.adminRenewMember(m.id, m.valid_until);
    if (!valid_until) return say("Não deu pra renovar");
    setMembers((l) => l.map((x) => (x.id === m.id ? { ...x, valid_until } : x)));
    say(`Renovado até ${fmt(valid_until, { day: "numeric", month: "short" })}`);
  }

  async function removerMensalista(m) {
    if (!(await askConfirm(`Remover ${m.name} dos mensalistas?`, "Remover"))) return;
    const ok = await store.adminRemoveMember(m.id);
    if (!ok) return say("Não consegui remover");
    setMembers((l) => l.filter((x) => x.id !== m.id));
  }

  async function liberarMensalista(m) {
    const ok = await store.adminResetMemberToken(m.id);
    if (!ok) return say("Não deu pra liberar");
    setMembers((l) => l.map((x) => (x.id === m.id ? { ...x, token: null } : x)));
    say(`${m.name} liberado pra vincular outro aparelho`);
  }

  async function copiar(txt, o) {
    try {
      await navigator.clipboard.writeText(txt);
      say(o ? `${o} copiado` : "Copiado");
    } catch {
      say("Copia na mão, o navegador não deixou");
    }
  }


  function textoWhatsApp() {
    const L = [];
    L.push("*FUTEBOL DE RESPEITO*");
    L.push(`${longDate(game.game_date)} · ${game.kickoff}`);
    L.push(MAPS_LINK);
    L.push("");
    L.push(`*Confirmados (${titulares.length}/${slots})*`);
    titulares.forEach((p, i) => L.push(`${i + 1}. ${p.name}${p.source === "mensalista" ? " (mensalista)" : ""} ${p.paid ? "✅" : "⏳"}`));
    if (reservas.length) {
      L.push("");
      L.push("*Reservas*");
      reservas.forEach((p, i) => L.push(`${i + 1}. ${p.name}${p.source === "mensalista" ? " (mensalista)" : ""} ${p.paid ? "✅" : "⏳"}`));
    }
    if (pendentes.length) {
      L.push("");
      L.push("*Aguardando pagamento*");
      pendentes.forEach((p, i) => L.push(`${i + 1}. ${p.name} ⏳`));
    }
    if (game.teams) {
      L.push("");
      L.push("*Times*");
      game.teams.forEach((t, i) => { if (t.length) L.push(`${KITS[i].name}: ${t.join(", ")}`); });
    }
    L.push("");
    L.push(`${eur(price)} cada · ${pagos.length}/${players.length} já pagaram`);
    L.push("");
    L.push(location.origin);
    return L.join("\n");
  }

  const Linha = (p, i, sub) => {
    const souEu = me && me.id === p.id;
    const podeRemover = isOrganizer || souEu;
    return html`
    <div class=${`row${souEu ? " mine" : ""}${sub ? " sub" : ""}`} key=${p.id}>
      <span class="num">${i + 1}</span>
      <span class="nm">${p.name}${souEu ? html`<i>VOCÊ</i>` : null}${p.source === "mensalista" ? html`<i style="color:var(--gold-deep)">MENSALISTA</i>` : null}</span>
      ${!p.paid && store.live
        ? html`<button class="tag tag-no" disabled=${stripeBusy} onClick=${() => pagarPendente(p)}>Pagar agora</button>`
        : isOrganizer
          ? html`<button class=${`tag ${p.paid ? "tag-ok" : "tag-no"}`} onClick=${() => togglePago(p)}>
              ${p.paid ? "Pago" : "Pendente"}
            </button>`
          : html`<span class=${`tag ${p.paid ? "tag-ok" : "tag-no"}`}>${p.paid ? "Pago" : "Pendente"}</span>`}
      ${isOrganizer && !p.paid && store.live && html`
        <button class="x ok" onClick=${() => togglePago(p)} aria-label="Marcar como pago manualmente" title="Marcar como pago manualmente">✓</button>`}
      ${podeRemover && html`<button class="x" onClick=${() => sair(p)} aria-label="Tirar da lista">✕</button>`}
    </div>`;
  };

  return html`
    <div class="wrap">

      ${isOrganizer && store.live && html`
        <div class="ob"><b>Organizador · ${user.email}</b><button onClick=${sairOrganizador}>Sair</button></div>`}

      ${!store.live && html`<div class="note">
        A lista está salva só neste celular. Para todo mundo ver a mesma, liga o Supabase
        (instruções no README).
      </div>`}

      <div class="hero">
        <${Pitch} />
        <div class="hero-in">
          <div class="brand"><${Crest} /><b>Futebol de Respeito</b></div>
          <div class="kick">
            <div class="dnum disp">${dayNum(game.game_date)}</div>
            <div class="dtxt">
              <div class="d1">${weekday(game.game_date)}<br />${monthName(game.game_date)}</div>
              <div class="d2">${game.kickoff} · ${countdown(game.game_date)}</div>
            </div>
          </div>
          <div class="hero-foot">
            <a class="pill" href=${MAPS_LINK} target="_blank" rel="noopener noreferrer">\u{1F4CD} ${CAMPO}</a>
            <span class=${`pill${lotado ? " hot" : ""}`}>
              ${lotado ? "Lotado" : `${titulares.length}/${slots} vagas`}
            </span>
            ${reservas.length ? html`<span class="pill">+${reservas.length} ${reservas.length === 1 ? "reserva" : "reservas"}</span>` : null}
          </div>
        </div>
      </div>

      ${myRow && !myRow.paid && html`
        <div class="pay-alert">
          <div class="pa-head">⚠️ Paga logo, camarada</div>
          <div class="pa-body">${avisoPagamento(game.game_date).corpo}</div>
        </div>`}

      ${mensalidadeVencendo && (() => {
        const n = daysAway(meuMembro.valid_until);
        const quando = n < 0 ? "vencida" : n === 0 ? "vence hoje" : n === 1 ? "vence amanhã" : `vence em ${n} dias`;
        return html`
          <div class="pay-alert">
            <div class="pa-head">⚠️ Mensalidade ${n < 0 ? "vencida" : "vencendo"}</div>
            <div class="pa-body">
              ${n < 0
                ? "Sua mensalidade venceu. Renove pra continuar entrando sem pagar toda semana."
                : `Sua mensalidade ${quando}. Renove pra não perder o mês.`}
            </div>
            <button class="btn btn-1 btn-s" style="margin-top:10px" disabled=${busy || stripeBusy}
              onClick=${() => pagarComStripe("mensal", { name: meuMembro.name, token: meuMembro.token })}>
              ${busy || stripeBusy ? "Abrindo…" : `Renovar · ${eur(priceMensal)}`}
            </button>
          </div>`;
      })()}

      <div class="card">
        ${myRow
          ? html`<div class="me-in">
              <div class="me-badge disp">${initials(myRow.name)}</div>
              <div class="me-txt">
                <b>${myRow.name}</b>
                ${!myRow.paid
                  ? html`<span>Aguardando pagamento · ${myPendingIdx + 1}º na fila pra pagar<br />Faltam ${eur(price)}. Sua vaga só conta depois do pagamento confirmado.</span>`
                  : html`<span>${myRow.source === "mensalista" ? "Mensalista · " : ""}${souReserva ? `Reserva · ${myPaidIdx - slots + 1}º da fila · entra se alguém sair` : `Confirmado · ${myPaidIdx + 1}º · vaga garantida`}</span>`}
              </div>
            </div>`
          : meuMembro && meuMembro.valid_until >= today()
            ? html`<div>
                <div class="card-t lbl" style="margin-bottom:6px">Sua vaga</div>
                <div class="empty" style="padding:0 0 12px;text-align:left">
                  Você é mensalista. Confirma que vai esse domingo pra entrar na lista — se não for, é só não confirmar.
                </div>
                <button class="btn btn-1" disabled=${busy} onClick=${confirmarPresencaMensal}>
                  ${busy ? "Confirmando…" : "Vou jogar esse domingo"}
                </button>
              </div>`
          : lotado
            ? html`<div>
                <div class="card-t lbl" style="margin-bottom:6px">Sua vaga</div>
                <div class="empty" style="padding:0;text-align:left">
                  Lotado — sem vagas nem como reserva. Só entra quem já está na lista.
                </div>
              </div>`
          : step === "nome"
            ? html`<div>
                <div class="card-t lbl" style="margin-bottom:10px">Sua vaga</div>
                <div class="inline">
                  <input value=${nome} placeholder="Seu nome"
                    onInput=${(e) => setNome(e.target.value)}
                    onKeyDown=${(e) => e.key === "Enter" && nome.trim() && setStep("pagamento")} />
                  <button class="btn btn-1 btn-s" style="padding-inline:20px" disabled=${!nome.trim()}
                    onClick=${() => setStep("pagamento")}>Continuar</button>
                </div>
              </div>`
            : (() => {
                const reivindicar = mensalistaParaReivindicar(nome);
                const jaMensalista = !reivindicar && mensalistaAtivo(nome);
                if (reivindicar) {
                  return html`<div>
                    <div class="card-t lbl" style="margin-bottom:4px">${nome.trim()} é mensalista</div>
                    <div class="empty" style="padding:0 0 12px;text-align:left;font-size:12.5px">
                      Alguém já pagou essa mensalidade por fora. Toca no botão pra vincular este aparelho — só precisa fazer isso uma vez.
                    </div>
                    <div class="inline">
                      <button class="btn btn-g btn-s" onClick=${() => setStep("nome")}>Voltar</button>
                      <button class="btn btn-1" disabled=${busy} onClick=${reivindicarMensalidade}>
                        ${busy ? "Vinculando…" : "Sou eu, confirmar neste aparelho"}
                      </button>
                    </div>
                  </div>`;
                }
                if (jaMensalista) {
                  return html`<div>
                    <div class="card-t lbl" style="margin-bottom:4px">${nome.trim()} já é mensalista</div>
                    <div class="empty" style="padding:0;text-align:left">
                      Essa mensalidade já está vinculada a outro aparelho. Se for você, abre o app no celular que você usou pra virar mensalista — ou pede pro organizador liberar de novo.
                    </div>
                    <div class="inline" style="margin-top:12px">
                      <button class="btn btn-g btn-s" onClick=${() => setStep("nome")}>Voltar</button>
                    </div>
                  </div>`;
                }
                return html`<div>
                  <div class="card-t lbl" style="margin-bottom:4px">${nome.trim()}</div>
                  <div class="empty" style="padding:0 0 12px;text-align:left;font-size:12.5px">
                    ${store.live
                      ? `Paga a semana ou vira mensalista. A vaga vira real assim que o pagamento for aprovado, sem precisar avisar ninguém.`
                      : `Sem o Supabase ligado, quem organiza confirma manualmente.`}
                  </div>
                  <div class="inline" style="flex-wrap:wrap">
                    <button class="btn btn-g btn-s" onClick=${() => setStep("nome")}>Voltar</button>
                    <button class="btn btn-2" disabled=${busy || stripeBusy} onClick=${() => pagarComStripe("avulso")}>
                      ${busy || stripeBusy ? "Abrindo…" : store.live ? `Avulso · ${eur(price)}` : "Entrar na lista"}
                    </button>
                    <button class="btn btn-1" disabled=${busy || stripeBusy} onClick=${() => pagarComStripe("mensal")}>
                      ${busy || stripeBusy ? "Abrindo…" : store.live ? `Virar mensalista · ${eur(priceMensal)}/mês` : "Virar mensalista"}
                    </button>
                  </div>
                </div>`;
              })()}
      </div>

      <div class="card">
        <div class="card-h">
          <span class="card-t lbl">Confirmados</span>
          <span class="card-n lbl">${titulares.length}/${slots}</span>
        </div>

        ${players.length === 0
          ? html`<div class="empty">Ninguém ainda.<br />Seja o primeiro a entrar.</div>`
          : html`
            <div>${titulares.map((p, i) => Linha(p, i, false))}</div>
            ${reservas.length
              ? html`<div><div class="sec lbl">Reservas</div>${reservas.map((p, i) => Linha(p, i, true))}</div>`
              : null}
            ${pendentes.length
              ? html`<div>
                  <div class="sec lbl">Aguardando pagamento</div>
                  <div style="font-size:11px;color:var(--faint);font-style:italic;margin:-2px 0 8px">
                    Quem paga primeiro entra primeiro — mesmo quem chegou depois.
                  </div>
                  ${pendentes.map((p, i) => Linha(p, i, true))}
                </div>`
              : null}
          `}

        ${isOrganizer && !lotado && html`
          <div class="inline" style="margin-top:16px">
            <input value=${admNome} placeholder="Adicionar alguém que não paga pelo app"
              onInput=${(e) => setAdmNome(e.target.value)}
              onKeyDown=${(e) => e.key === "Enter" && adminAdicionar()} />
            <button class="btn btn-g btn-s" style="padding-inline:18px" disabled=${!admNome.trim() || busy}
              onClick=${adminAdicionar}>Add</button>
          </div>`}

        ${players.length > 0 && html`
          <button class="btn btn-2" style="margin-top:8px" onClick=${() => copiar(textoWhatsApp(), "Lista")}>
            Copiar lista pro WhatsApp
          </button>`}
      </div>

      <div class="card">
        <div class="money">
          <div>
            <div class="big disp">${eur(avulsosPagos * price)}</div>
            <div class="cap">de ${eur(avulsosTotal * price)} · ${eur(price)} cada</div>
          </div>
          <div class="side"><b>${avulsosPagos}/${avulsosTotal}</b>pagaram</div>
        </div>
        <div class="bar"><i style=${`width:${pct}%`}></i></div>
      </div>

      <div class="card">
        <div class="card-h">
          <span class="card-t lbl">Times</span>
          ${isOrganizer && html`
            <button class="btn btn-1 btn-s" disabled=${titulares.length < 3 || rolling} onClick=${sortear}>
              ${rolling ? "Sorteando…" : game.teams ? "Sortear de novo" : "Sortear"}
            </button>`}
        </div>

        ${titulares.length < 3
          ? html`<div class="empty">Faltam jogadores.<br />Precisa de 3 para dividir os times.</div>`
          : game.teams
            ? html`<div class=${`teams${rolling ? " rolling" : ""}`}>
                ${game.teams.map((t, i) => html`
                  <div class="team" key=${i} style=${`--kit:${KITS[i].edge}`}>
                    <div class="team-h"><${Shirt} color=${KITS[i].color} /><b>${KITS[i].name}</b></div>
                    ${t.length ? t.map((n, j) => html`<p key=${j}>${n}</p>`) : html`<p style="opacity:.5">—</p>`}
                  </div>`)}
              </div>`
            : html`<div class="empty">${isOrganizer ? "Sem sorteio ainda." : "O organizador ainda não sorteou os times."}<br />${titulares.length} jogadores prontos.</div>`}
      </div>

      ${isOrganizer
        ? html`<details class="card editable org">
            <summary class="lbl">Organização</summary>
            <div class="grid2">
              <div class="field">
                <label class="lbl">Hora</label>
                <input type="time" value=${game.kickoff} onChange=${(e) => salvarOrganizacao({ kickoff: e.target.value })} />
              </div>
              <div class="field">
                <label class="lbl">Vagas</label>
                <input type="number" min="3" value=${slots} onChange=${(e) => salvarOrganizacao({ slots: Math.max(3, parseInt(e.target.value) || 3) })} />
              </div>
            </div>
            <div class="field">
              <label class="lbl">Mensalidade</label>
              <input type="number" min="0" step="0.5" value=${priceMensal} onChange=${(e) => salvarOrganizacao({ price_mensal: Math.max(0, parseFloat(e.target.value) || 0) })} />
            </div>
            <button class="btn btn-g" style="margin-top:16px" onClick=${abrirProximoDomingo}>
              Abrir o próximo domingo
            </button>

            <div class="card-t lbl" style="margin-top:22px;margin-bottom:10px">Mensalistas</div>
            ${members.length === 0
              ? html`<div class="empty" style="padding:0 0 12px">Ninguém ainda.</div>`
              : members.map((m) => html`
                  <div class="row sub" key=${m.id}>
                    <span class="nm">${m.name}<i style=${`color:${m.valid_until >= today() ? "var(--gold-deep)" : "var(--blue)"}`}>${m.valid_until >= today() ? `ATÉ ${fmt(m.valid_until, { day: "numeric", month: "short" })}` : "VENCIDO"}</i></span>
                    ${!m.token && html`<span class="tag tag-no">Sem aparelho</span>`}
                    <button class="x ok" onClick=${() => renovarMensalista(m)} aria-label="Renovar 1 mês" title="Renovar 1 mês">↻</button>
                    ${m.token && html`<button class="x" onClick=${() => liberarMensalista(m)} aria-label="Liberar aparelho" title="Liberar aparelho (trocou de celular)">⟲</button>`}
                    <button class="x" onClick=${() => removerMensalista(m)} aria-label="Remover mensalista">✕</button>
                  </div>`)}
            <div class="inline" style="margin-top:12px">
              <input value=${novoMensalista} placeholder="Nome de quem pagou por fora"
                onInput=${(e) => setNovoMensalista(e.target.value)}
                onKeyDown=${(e) => e.key === "Enter" && adicionarMensalista(novoMensalista)} />
              <button class="btn btn-g btn-s" style="padding-inline:18px" disabled=${!novoMensalista.trim() || busy}
                onClick=${() => adicionarMensalista(novoMensalista)}>Add</button>
            </div>
          </details>`
        : html`<div class="card">
            <div class="card-t lbl" style="margin-bottom:12px">Organização</div>
            <div class="info-grid">
              <div class="info-item"><div class="k lbl">Hora</div><div class="v">${game.kickoff}</div></div>
              <div class="info-item"><div class="k lbl">Vagas</div><div class="v">${slots}</div></div>
              <div class="info-item"><div class="k lbl">Valor</div><div class="v">${eur(price)}</div></div>
              <div class="info-item"><div class="k lbl">Mensalidade</div><div class="v">${eur(priceMensal)}</div></div>
              <div class="info-item"><div class="k lbl">Status</div><div class="v">${lotado ? "Lotado" : "Aberto"}</div></div>
            </div>
          </div>`}

      ${me && html`<button class="btn btn-g" onClick=${() => { localStorage.removeItem(ME_KEY); setMe(null); say("Beleza, esqueci quem você é"); }}>
        Não sou mais o ${me.name}
      </button>`}

      <div class="foot">
        <span class="status">
          ${store.live
            ? html`<span class="live">Lista compartilhada, atualiza sozinha</span>`
            : "Salvo só neste celular"}
        </span>
        ${!isOrganizer && store.live && html`<button class="gestor" onClick=${() => setLoginOpen(true)}>Área do organizador</button>`}
      </div>
    </div>

    ${loginOpen && h(LoginModal, { onClose: () => { setLoginOpen(false); setLoginErr(""); }, onSubmit: fazerLogin, err: loginErr, busy: loginBusy })}
    ${confirmState && h(ConfirmModal, confirmState)}
    ${toast && html`<div class="toast">${toast}</div>`}
  `;
}

/* ---------------- arranque ---------------- */
(async () => {
  let store;
  try {
    store = configured ? await remoteStore() : localStore();
  } catch (e) {
    console.error("Supabase falhou, usando armazenamento local:", e);
    store = localStore();
  }
  render(h(App, { store }), document.getElementById("app"));
})();
</script>
</body>
</html>
