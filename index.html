<style>
:root{
  --bg:#061A11; --card:#0E2E1F; --card2:#123A28; --line:rgba(255,255,255,.09);
  --txt:#EAF5EE; --dim:#8FB09E; --faint:#5D7D6C;
  --acc:#2FE38B; --acc-d:#17A862; --acc-ink:#04311D; --warn:#FFC24B; --bad:#FF6B6B;
  --r:16px; --pad:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--txt); min-height:100dvh;

.wrap{max-width:560px;margin:0 auto;padding:0 14px;display:flex;flex-direction:column;gap:12px}
.disp{font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:700;letter-spacing:.01em;line-height:1}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad)}

.card-t{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.09em}

.hero{position:relative;overflow:hidden;border-radius:var(--r);border:1px solid var(--line);

input,select{font:inherit;width:100%;background:#0A2417;border:1px solid var(--line);color:var(--txt);

.bar{height:7px;border-radius:999px;background:#0A2417;overflow:hidden;border:1px solid var(--line)}

@keyframes pop{from{opacity:0;transform:translateY(9px) scale(.97)}to{opacity:1;transform:none}}
.rolling .team{animation:none}

details.org summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;
  font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.09em;text-transform:uppercase}
details.org summary::-webkit-details-marker{display:none}
details.org[open] summary{margin-bottom:14px}
details.org summary::after{content:"\25BE";transition:transform .2s}
details.org[open] summary::after{transform:rotate(180deg)}

.note{font-size:12.5px;color:var(--warn);background:rgba(255,194,75,.1);border:1px solid rgba(255,194,75,.25);
  border-radius:11px;padding:10px 12px;line-height:1.45}
.foot{text-align:center;font-size:11.5px;color:var(--faint);padding:4px 0 8px}
.live{display:inline-flex;align-items:center;gap:6px}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc);
  animation:blink 1.8s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--acc);
  color:var(--acc-ink);font-size:13px;font-weight:700;padding:11px 18px;border-radius:999px;z-index:9;
  animation:up .25s ease both;box-shadow:0 8px 24px rgba(0,0,0,.45)}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.boot{display:grid;place-items:center;min-height:70dvh;color:var(--faint);font-size:13px}
</style>

<body>
<div id="app"><div class="boot">A carregar a pelada…</div></div>

<script type="module">
import { h, render } from "https://esm.sh/preact@10.19.6";
import { useState, useEffect, useRef, useCallback } from "https://esm.sh/preact@10.19.6/hooks";
import htm from "https://esm.sh/htm@3.1.1";

const html = htm.bind(h);

/* ============================================================
   CONFIGURAÇÃO
   Muda aqui os dados do grupo. Os dois primeiros valores ligam
   a app ao Supabase (Project Settings > API). Enquanto
   estiverem por preencher, a app guarda tudo só neste
   telemóvel — funciona, mas não é partilhada.
   ============================================================ */
const SUPABASE_URL = "COLOCAR_AQUI";
const SUPABASE_ANON_KEY = "COLOCAR_AQUI";

const IBAN = "PT50 0007 0000 0658 0592 5323";
const MBWAY = "+351 914 068 950";
const MAPS_LINK = "https://maps.app.goo.gl/aCSuyV77kXDmsYV47?g_st=ic";
const CAMPO = "Ver o campo no mapa";

const DEFAULTS = { kickoff: "10:00", slots: 15, price: 5 };
const ME_KEY = "fdr:me";
const LOCAL_KEY = "fdr:local";

const configured = SUPABASE_URL !== "COLOCAR_AQUI" && SUPABASE_ANON_KEY !== "COLOCAR_AQUI";

const KITS = [
  { name: "Coletes", color: "#FF8A1E" },
  { name: "Brancos", color: "#F2F5F3" },
  { name: "Escuros", color: "#5B7CFF" },
];

/* ---------------- datas ---------------- */
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const today = () => iso(new Date());

function nextSunday(from) {
  const d = from ? new Date(from + "T00:00:00") : new Date();
  const base = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const add = (7 - base.getDay()) % 7;
  base.setDate(base.getDate() + (from ? add || 7 : add));
  return iso(base);
}

function longDate(d) {
  return new Date(d + "T00:00:00").toLocaleDateString("pt-PT", { weekday: "long", day: "numeric", month: "long" });
}
function weekday(d) {
  return new Date(d + "T00:00:00").toLocaleDateString("pt-PT", { weekday: "long" });
}
function dayNum(d) {
  return new Date(d + "T00:00:00").getDate();
}
function monthName(d) {
  return new Date(d + "T00:00:00").toLocaleDateString("pt-PT", { month: "long" });
}
function daysAway(d) {
  const a = new Date(today() + "T00:00:00");
  const b = new Date(d + "T00:00:00");
  return Math.round((b - a) / 86400000);
}
function countdown(d) {
  const n = daysAway(d);
  if (n < 0) return "já foi";
  if (n === 0) return "é hoje";
  if (n === 1) return "é amanhã";
  return `faltam ${n} dias`;
}

const eur = (n) => `${Number(n || 0).toFixed(2).replace(".", ",").replace(",00", "")}€`;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function initials(name) {
  const p = name.trim().split(/\s+/);
  return ((p[0] || "")[0] + (p.length > 1 ? p[p.length - 1][0] : "")).toUpperCase();
}

/* ============================================================
   CAMADA DE DADOS
   Duas implementações com a mesma interface. A app não sabe
   qual está a usar — muda só a linha do "store" no fim.
   ============================================================ */
function localStore() {
  const read = () => {
    try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || {}; } catch { return {}; }
  };
  const write = (s) => { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(s)); } catch {} };

  return {
    live: false,
    async currentGame() {
      const s = read();
      if (s.game && s.game.game_date >= today()) return s.game;
      const game = { game_date: nextSunday(), ...DEFAULTS, teams: null };
      write({ ...s, game, players: s.game ? [] : s.players || [] });
      return game;
    },
    async saveGame(date, patch) {
      const s = read();
      const game = { ...(s.game || {}), ...patch, game_date: patch.game_date || date };
      if (patch.game_date && patch.game_date !== date) s.players = [];
      write({ ...s, game });
      return game;
    },
    async players() {
      return read().players || [];
    },
    async addPlayer(date, name) {
      const s = read();
      const row = { id: `l${Date.now()}${Math.random().toString(16).slice(2, 6)}`, name, paid: false };
      s.players = [...(s.players || []), row];
      write(s);
      return row;
    },
    async setPaid(id, paid) {
      const s = read();
      s.players = (s.players || []).map((p) => (p.id === id ? { ...p, paid } : p));
      write(s);
    },
    async removePlayer(id) {
      const s = read();
      s.players = (s.players || []).filter((p) => p.id !== id);
      write(s);
    },
    subscribe() { return () => {}; },
  };
}

async function remoteStore() {
  const { createClient } = await import("https://esm.sh/@supabase/supabase-js@2.39.7");
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  return {
    live: true,
    async currentGame() {
      const { data } = await sb.from("games").select("*").gte("game_date", today())
        .order("game_date", { ascending: true }).limit(1);
      if (data && data.length) return data[0];
      const novo = { game_date: nextSunday(), ...DEFAULTS, teams: null };
      const { data: ins } = await sb.from("games").upsert(novo).select().single();
      return ins || novo;
    },
    async saveGame(date, patch) {
      if (patch.game_date && patch.game_date !== date) {
        const { data: existente } = await sb.from("games").select("*").eq("game_date", patch.game_date).maybeSingle();
        if (existente) return existente;
        const { data } = await sb.from("games")
          .upsert({ game_date: patch.game_date, kickoff: patch.kickoff, slots: patch.slots, price: patch.price, teams: null })
          .select().single();
        return data;
      }
      const { data } = await sb.from("games").update({ ...patch, updated_at: new Date().toISOString() })
        .eq("game_date", date).select().single();
      return data;
    },
    async players(date) {
      const { data, error } = await sb.from("players").select("*").eq("game_date", date)
        .order("created_at", { ascending: true });
      if (error) { console.error(error); return []; }
      return data.map((r) => ({ id: r.id, name: r.name, paid: r.paid }));
    },
    async addPlayer(date, name) {
      const { data, error } = await sb.from("players").insert({ game_date: date, name, paid: false }).select().single();
      if (error) { console.error(error); return null; }
      return { id: data.id, name: data.name, paid: data.paid };
    },
    async setPaid(id, paid) {
      const { error } = await sb.from("players").update({ paid }).eq("id", id);
      if (error) console.error(error);
    },
    async removePlayer(id) {
      const { error } = await sb.from("players").delete().eq("id", id);
      if (error) console.error(error);
    },
    subscribe(date, onChange) {
      const ch = sb.channel(`fdr-${date}`)
        .on("postgres_changes", { event: "*", schema: "public", table: "players", filter: `game_date=eq.${date}` }, onChange)
        .on("postgres_changes", { event: "*", schema: "public", table: "games" }, onChange)
        .subscribe();
      return () => sb.removeChannel(ch);
    },
  };
}

/* ============================================================
   PEÇAS VISUAIS
   ============================================================ */
const Pitch = () => html`
  <svg class="pitch" viewBox="0 0 400 220" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g fill="none" stroke="#ffffff" stroke-width="1.6">
      <rect x="8" y="8" width="384" height="204" rx="3" />
      <line x1="200" y1="8" x2="200" y2="212" />
      <circle cx="200" cy="110" r="42" />
      <circle cx="200" cy="110" r="3" fill="#ffffff" stroke="none" />
      <rect x="8" y="55" width="52" height="110" />
      <rect x="340" y="55" width="52" height="110" />
    </g>
  </svg>`;

const Crest = () => html`
  <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true">
    <path d="M16 2 29 6v10c0 8-6.5 13-13 14C9.5 29 3 24 3 16V6z" fill="none" stroke="#2FE38B" stroke-width="2" />
    <circle cx="16" cy="15" r="5.5" fill="none" stroke="#2FE38B" stroke-width="1.8" />
    <path d="M16 9.5v11M10.5 15h11" stroke="#2FE38B" stroke-width="1.8" />
  </svg>`;

const Shirt = ({ color }) => html`
  <svg class="shirt" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M8.5 2 4 4.5 2.5 9l3 1.2V22h13V10.2l3-1.2L20 4.5 15.5 2a3.7 3.7 0 0 1-7 0z"
      fill=${color} stroke="rgba(0,0,0,.35)" stroke-width=".8" />
  </svg>`;

function CopyRow({ k, v, onCopy }) {
  return html`
    <div class="copyrow">
      <div>
        <div class="k">${k}</div>
        <div class="v">${v}</div>
      </div>
      <button class="btn btn-2 btn-s" onClick=${() => onCopy(v, k)}>Copiar</button>
    </div>`;
}

/* ============================================================
   APP
   ============================================================ */
function App({ store }) {
  const [game, setGame] = useState(null);
  const [players, setPlayers] = useState([]);
  const [me, setMe] = useState(() => { try { return JSON.parse(localStorage.getItem(ME_KEY)); } catch { return null; } });
  const [nome, setNome] = useState("");
  const [outro, setOutro] = useState("");
  const [rolling, setRolling] = useState(false);
  const [toast, setToast] = useState("");
  const [busy, setBusy] = useState(false);
  const timer = useRef(null);

  const say = useCallback((m) => {
    setToast(m);
    clearTimeout(timer.current);
    timer.current = setTimeout(() => setToast(""), 1800);
  }, []);

  const refresh = useCallback(async (date) => {
    const rows = await store.players(date);
    setPlayers(rows);
  }, [store]);

  useEffect(() => {
    let alive = true;
    (async () => {
      const g = await store.currentGame();
      if (!alive) return;
      setGame(g);
      const rows = await store.players(g.game_date);
      if (alive) setPlayers(rows);
    })();
    return () => { alive = false; };
  }, [store]);

  useEffect(() => {
    if (!game) return;
    const off = store.subscribe(game.game_date, async () => {
      const g = await store.currentGame();
      setGame(g);
      const rows = await store.players(g.game_date);
      setPlayers(rows);
    });
    return off;
  }, [store, game && game.game_date]);

  if (!game) return html`<div class="boot">A carregar a pelada…</div>`;

  const slots = game.slots || DEFAULTS.slots;
  const price = Number(game.price ?? DEFAULTS.price);
  const titulares = players.slice(0, slots);
  const suplentes = players.slice(slots);
  const pagos = players.filter((p) => p.paid);
  const pct = players.length ? Math.round((pagos.length / players.length) * 100) : 0;
  const myRow = me ? players.find((p) => p.id === me.id) : null;
  const myIdx = myRow ? players.findIndex((p) => p.id === me.id) : -1;
  const souSuplente = myIdx >= slots;

  async function patch(p) {
    const g = await store.saveGame(game.game_date, p);
    if (g) {
      setGame(g);
      if (p.game_date && p.game_date !== game.game_date) refresh(g.game_date);
    }
  }

  async function entrar() {
    const n = nome.trim();
    if (!n || busy) return;
    setBusy(true);
    const row = await store.addPlayer(game.game_date, n);
    setBusy(false);
    if (!row) return say("Não deu para entrar");
    const novo = { id: row.id, name: row.name };
    localStorage.setItem(ME_KEY, JSON.stringify(novo));
    setMe(novo);
    setNome("");
    setPlayers((p) => (p.some((x) => x.id === row.id) ? p : [...p, row]));
    await patch({ teams: null });
    say(players.length >= slots ? "Ficaste como suplente" : "Estás dentro");
  }

  async function adicionar() {
    const n = outro.trim();
    if (!n || busy) return;
    setBusy(true);
    const row = await store.addPlayer(game.game_date, n);
    setBusy(false);
    if (!row) return;
    setOutro("");
    setPlayers((p) => (p.some((x) => x.id === row.id) ? p : [...p, row]));
    await patch({ teams: null });
    say(`${row.name} na lista`);
  }

  async function togglePago(p) {
    const novo = !p.paid;
    setPlayers((l) => l.map((x) => (x.id === p.id ? { ...x, paid: novo } : x)));
    await store.setPaid(p.id, novo);
  }

  async function sair(p) {
    if (!confirm(`Tirar ${p.name} da lista?`)) return;
    setPlayers((l) => l.filter((x) => x.id !== p.id));
    await store.removePlayer(p.id);
    if (me && me.id === p.id) { localStorage.removeItem(ME_KEY); setMe(null); }
    await patch({ teams: null });
  }

  function sortear() {
    if (titulares.length < 3 || rolling) return;
    setRolling(true);
    let t = 0;
    const iv = setInterval(async () => {
      t++;
      const s = shuffle(titulares.map((p) => p.name));
      const prev = [[], [], []];
      s.forEach((n, i) => prev[i % 3].push(n));
      if (t >= 11) {
        clearInterval(iv);
        setRolling(false);
        await patch({ teams: prev });
      } else {
        setGame((g) => ({ ...g, teams: prev }));
      }
    }, 85);
  }

  async function copiar(txt, o) {
    try {
      await navigator.clipboard.writeText(txt);
      say(o ? `${o} copiado` : "Copiado");
    } catch {
      say("Copia à mão, o browser não deixou");
    }
  }

  function textoWhatsApp() {
    const L = [];
    L.push("*FUTEBOL DE RESPEITO*");
    L.push(`${longDate(game.game_date)} · ${game.kickoff}`);
    L.push(MAPS_LINK);
    L.push("");
    L.push(`*Convocados (${titulares.length}/${slots})*`);
    titulares.forEach((p, i) => L.push(`${i + 1}. ${p.name} ${p.paid ? "✅" : "⏳"}`));
    if (suplentes.length) {
      L.push("");
      L.push("*Suplentes*");
      suplentes.forEach((p, i) => L.push(`${i + 1}. ${p.name} ${p.paid ? "✅" : "⏳"}`));
    }
    if (game.teams) {
      L.push("");
      L.push("*Equipas*");
      game.teams.forEach((t, i) => { if (t.length) L.push(`${KITS[i].name}: ${t.join(", ")}`); });
    }
    L.push("");
    L.push(`${eur(price)} cada · ${pagos.length}/${players.length} já pagaram`);
    L.push(`IBAN: ${IBAN}`);
    L.push(`MB Way: ${MBWAY}`);
    L.push("");
    L.push(location.origin);
    return L.join("\n");
  }

  const Linha = (p, i, sub) => html`
    <div class=${`row${me && me.id === p.id ? " mine" : ""}${sub ? " sub" : ""}`} key=${p.id}>
      <span class="num disp">${sub ? i + 1 : i + 1}</span>
      <span class="nm">${p.name}${me && me.id === p.id ? html`<i>TU</i>` : null}</span>
      <button class=${`tag ${p.paid ? "tag-ok" : "tag-no"}`} onClick=${() => togglePago(p)}>
        ${p.paid ? "Pago" : "Falta"}
      </button>
      <button class="x" onClick=${() => sair(p)} aria-label="Tirar da lista">✕</button>
    </div>`;

  return html`
    <div class="wrap">

      ${!configured && html`<div class="note">
        A lista está guardada só neste telemóvel. Para todos verem a mesma, liga o Supabase
        (instruções no README).
      </div>`}

      <div class="hero">
        <${Pitch} />
        <div class="hero-in">
          <div class="brand"><${Crest} /><b>Futebol de Respeito</b></div>
          <div class="kick">
            <div class="dnum disp">${dayNum(game.game_date)}</div>
            <div class="dtxt">
              <div class="d1 disp">${weekday(game.game_date)}, ${monthName(game.game_date)}</div>
              <div class="d2 up">${game.kickoff} · ${countdown(game.game_date)}</div>
            </div>
          </div>
          <div class="hero-foot">
            <a class="pill" href=${MAPS_LINK} target="_blank" rel="noopener noreferrer">\u{1F4CD} ${CAMPO}</a>
            <span class="pill">${titulares.length}/${slots} ${titulares.length >= slots ? "· lotado" : "vagas"}</span>
            ${suplentes.length ? html`<span class="pill">+${suplentes.length} ${suplentes.length === 1 ? "suplente" : "suplentes"}</span>` : null}
          </div>
        </div>
      </div>

      <div class="card">
        ${myRow
          ? html`<div class="me-in">
              <div class="me-badge disp">${initials(myRow.name)}</div>
              <div class="me-txt">
                <b>${myRow.name}</b>
                <span>${souSuplente ? `Suplente · ${myIdx - slots + 1}º na fila` : `Convocado · posição ${myIdx + 1}`} · ${myRow.paid ? "pago" : `faltam ${eur(price)}`}</span>
              </div>
              <button class=${`btn btn-s ${myRow.paid ? "btn-2" : "btn-1"}`} onClick=${() => togglePago(myRow)}>
                ${myRow.paid ? "Pago ✓" : "Já paguei"}
              </button>
            </div>`
          : html`<div>
              <div class="card-t" style="margin-bottom:10px">A tua vaga</div>
              <div style="display:flex;gap:8px">
                <input value=${nome} placeholder="O teu nome"
                  onInput=${(e) => setNome(e.target.value)}
                  onKeyDown=${(e) => e.key === "Enter" && entrar()} />
                <button class="btn btn-1 btn-s" style="padding-inline:18px" disabled=${!nome.trim() || busy}
                  onClick=${entrar}>Entrar</button>
              </div>
            </div>`}
      </div>

      <div class="card">
        <div class="card-h">
          <span class="card-t">Convocados</span>
          <span class="card-t">${titulares.length}/${slots}</span>
        </div>

        ${players.length === 0
          ? html`<div class="empty">Ainda ninguém. Sê o primeiro a entrar.</div>`
          : html`
            <div>${titulares.map((p, i) => Linha(p, i, false))}</div>
            ${suplentes.length
              ? html`<div><div class="sec">Suplentes</div>${suplentes.map((p, i) => Linha(p, i, true))}</div>`
              : null}
          `}

        <div style="display:flex;gap:8px;margin-top:12px">
          <input value=${outro} placeholder="Juntar outro jogador"
            onInput=${(e) => setOutro(e.target.value)}
            onKeyDown=${(e) => e.key === "Enter" && adicionar()} />
          <button class="btn btn-2 btn-s" style="padding-inline:16px" disabled=${!outro.trim() || busy}
            onClick=${adicionar}>Juntar</button>
        </div>

        ${players.length > 0 && html`
          <button class="btn btn-2" style="margin-top:8px" onClick=${() => copiar(textoWhatsApp(), "Lista")}>
            Copiar lista para o WhatsApp
          </button>`}
      </div>

      <div class="card">
        <div class="money">
          <div>
            <div class="big disp">${eur(pagos.length * price)}</div>
            <div class="sub" style="text-align:left">de ${eur(players.length * price)} · ${eur(price)} cada</div>
          </div>
          <div class="sub">${pagos.length}/${players.length}<br />pagaram</div>
        </div>
        <div class="bar"><i style=${`width:${pct}%`}></i></div>
        <div style="margin-top:12px">
          <${CopyRow} k="IBAN" v=${IBAN} onCopy=${copiar} />
          <${CopyRow} k="MB WAY" v=${MBWAY} onCopy=${copiar} />
        </div>
      </div>

      <div class="card">
        <div class="card-h">
          <span class="card-t">Equipas</span>
          <button class="btn btn-1 btn-s" disabled=${titulares.length < 3 || rolling} onClick=${sortear}>
            ${rolling ? "A sortear…" : game.teams ? "Sortear outra vez" : "Sortear"}
          </button>
        </div>

        ${titulares.length < 3
          ? html`<div class="empty">Faltam jogadores. São precisos 3 para dividir equipas.</div>`
          : game.teams
            ? html`<div class=${`teams${rolling ? " rolling" : ""}`}>
                ${game.teams.map((t, i) => html`
                  <div class="team" key=${i}>
                    <div class="team-h"><${Shirt} color=${KITS[i].color} /><b class="disp">${KITS[i].name}</b></div>
                    ${t.length ? t.map((n, j) => html`<p key=${j}>${n}</p>`) : html`<p style="opacity:.5">—</p>`}
                  </div>`)}
              </div>`
            : html`<div class="empty">Por sortear. ${titulares.length} jogadores prontos.</div>`}
      </div>

      <details class="card org">
        <summary>Organização</summary>
        <div class="grid2">
          <div class="field">
            <label>Data</label>
            <input type="date" value=${game.game_date} onChange=${(e) => patch({ game_date: e.target.value, kickoff: game.kickoff, slots, price })} />
          </div>
          <div class="field">
            <label>Hora</label>
            <input type="time" value=${game.kickoff} onChange=${(e) => patch({ kickoff: e.target.value })} />
          </div>
        </div>
        <div class="grid2">
          <div class="field">
            <label>Vagas</label>
            <input type="number" min="3" value=${slots} onChange=${(e) => patch({ slots: Math.max(3, parseInt(e.target.value) || 3), teams: null })} />
          </div>
          <div class="field">
            <label>Preço por jogador</label>
            <input type="number" min="0" step="0.5" value=${price} onChange=${(e) => patch({ price: Math.max(0, parseFloat(e.target.value) || 0) })} />
          </div>
        </div>
        <button class="btn btn-g" style="margin-top:14px"
          onClick=${() => confirm("Abrir o jogo do próximo domingo? A lista desse jogo começa vazia.")
            && patch({ game_date: nextSunday(game.game_date), kickoff: game.kickoff, slots, price })}>
          Abrir o próximo domingo
        </button>
        ${me && html`<button class="btn btn-g" style="margin-top:8px"
          onClick=${() => { localStorage.removeItem(ME_KEY); setMe(null); say("Já não és ninguém aqui"); }}>
          Esquecer que sou o ${me.name}
        </button>`}
      </details>

      <div class="foot">
        ${store.live
          ? html`<span class="live">Lista partilhada, atualiza sozinha</span>`
          : "Guardado só neste telemóvel"}
      </div>
    </div>

    ${toast && html`<div class="toast">${toast}</div>`}
  `;
}

/* ---------------- arranque ---------------- */
(async () => {
  let store;
  try {
    store = configured ? await remoteStore() : localStore();
  } catch (e) {
    console.error("Supabase falhou, a usar armazenamento local:", e);
    store = localStore();
  }
  render(h(App, { store }), document.getElementById("app"));
})();
</script>
</body>
</html>
