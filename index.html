<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Futebol de Respeito · A pelada de domingo</title>
<meta name="description" content="Lista da pelada, pagamentos e sorteio de times. Entra, paga, joga." />
<meta name="theme-color" content="#37003C" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icon.png" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />

<meta property="og:type" content="website" />

<meta property="og:description" content="Entra na lista, paga a sua parte e vê os times. Domingo é domingo." />

<style>
:root{
  --pl:#37003C; --pl-2:#520059; --pl-3:#220026; --pl-soft:#5B0063;
  --ink:#1A001F; --dim:#6E5C73; --faint:#9A8B9E;
  --card:#FFFFFF; --soft:#F6F3F7; --soft-2:#EDE7EF; --line:rgba(26,0,31,.09);
  --green:#00FF87; --green-deep:#00C46A; --pink:#E90052; --cyan:#04F5FF;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:28px;
  --r-lg:18px; --r-md:12px; --r-sm:9px;
  --ease:cubic-bezier(.4,0,.2,1);
  --shadow:0 1px 2px rgba(26,0,31,.10), 0 6px 16px rgba(26,0,31,.08);
  --shadow-lg:0 2px 6px rgba(26,0,31,.14), 0 18px 40px rgba(26,0,31,.16);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--pl); color:var(--ink); min-height:100dvh;
  font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-feature-settings:"cv11","ss01";
  padding:env(safe-area-inset-top) 0 calc(var(--s6) + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 60% at 50% -10%, rgba(255,255,255,.11), transparent 60%);
}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 var(--s4);
  display:flex;flex-direction:column;gap:var(--s3)}
.disp{font-family:Archivo,system-ui,sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1}
.lbl{font-family:Archivo,system-ui,sans-serif;font-size:10.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.13em}

/* ---------- cartões ---------- */
.card{background:var(--card);border-radius:var(--r-lg);padding:var(--s5);box-shadow:var(--shadow);
  animation:rise .5s var(--ease) both}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s4)}
.card-t{color:var(--pl)}
.card-n{color:var(--faint)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- cartão do jogo ---------- */
.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);
  background:linear-gradient(155deg,var(--pl-soft) 0%,var(--pl-2) 40%,var(--pl-3) 100%);
  padding:var(--s6) var(--s5) var(--s5);box-shadow:var(--shadow-lg);
  animation:rise .5s var(--ease) both}
.hero::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--green) 0 33.33%,var(--cyan) 33.33% 66.66%,var(--pink) 66.66% 100%)}
.hero::after{content:"";position:absolute;width:280px;height:280px;right:-90px;top:-120px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,255,135,.16),transparent 68%);pointer-events:none}
.hero .pitch{position:absolute;inset:0;width:100%;height:100%;opacity:.1;pointer-events:none}
.hero-in{position:relative}
.brand{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s5)}
.brand b{font-family:Archivo,system-ui,sans-serif;font-size:12px;font-weight:800;color:#fff;
  letter-spacing:.16em;text-transform:uppercase}
.kick{display:flex;align-items:center;gap:var(--s4)}
.kick .dnum{font-size:66px;color:#fff;letter-spacing:-.04em}
.kick .dtxt{min-width:0}
.kick .d1{font-family:Archivo,system-ui,sans-serif;font-size:17px;font-weight:700;color:#fff;
  text-transform:uppercase;letter-spacing:.02em;line-height:1.15}
.kick .d2{font-size:12px;color:var(--green);font-weight:600;margin-top:var(--s1);letter-spacing:.02em}
.hero-foot{display:flex;gap:var(--s2);margin-top:var(--s5);flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);
  border-radius:999px;padding:8px 14px;font-size:12px;color:#fff;text-decoration:none;font-weight:500;
  transition:background .18s var(--ease)}
.pill:active{background:rgba(255,255,255,.22)}
.pill.hot{background:var(--pink)}

/* ---------- botões ---------- */
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;
  font-family:Archivo,system-ui,sans-serif;padding:14px var(--s4);border-radius:var(--r-md);
  font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  transition:transform .18s var(--ease),filter .18s var(--ease),opacity .18s var(--ease)}
.btn:active{transform:scale(.975);filter:brightness(.95)}
.btn:disabled{opacity:.32;cursor:default;transform:none}
.btn-1{background:var(--green);color:var(--pl)}
.btn-2{background:var(--pl);color:#fff}
.btn-g{background:var(--soft);color:var(--pl)}
.btn-s{width:auto;padding:10px var(--s4);font-size:11px;border-radius:var(--r-sm)}

/* ---------- inputs ---------- */
input{font:inherit;width:100%;background:var(--soft);border:1.5px solid transparent;color:var(--ink);
  border-radius:var(--r-md);padding:13px var(--s3);outline:none;
  transition:border-color .18s var(--ease),background .18s var(--ease)}
input:focus{border-color:var(--pl);background:#fff}
input::placeholder{color:var(--faint)}
label{display:block;color:var(--pl);margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.field+.field,.grid2+.field,.field+.grid2,.grid2+.grid2{margin-top:var(--s3)}
.inline{display:flex;gap:var(--s2)}

/* ---------- sua vaga ---------- */
.me-in{display:flex;align-items:center;gap:var(--s3)}
.me-badge{width:48px;height:48px;border-radius:var(--r-md);background:var(--pl);color:var(--green);
  display:grid;place-items:center;flex:none;font-size:16px}
.me-txt{flex:1;min-width:0}
.me-txt b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.me-txt span{font-size:12.5px;color:var(--dim)}

/* ---------- lista ---------- */
.sec{color:var(--faint);margin:var(--s5) 0 var(--s2);display:flex;align-items:center;gap:var(--s2)}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.row{display:flex;align-items:center;gap:9px;padding:10px;border-radius:var(--r-sm);
  background:var(--soft);border-left:3px solid transparent;
  transition:background .18s var(--ease);animation:slide .35s var(--ease) both}
.row+.row{margin-top:var(--s1)}
.row.mine{border-left-color:var(--pink);background:rgba(233,0,82,.055)}
.row.sub{opacity:.62}
@keyframes slide{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.num{width:24px;height:24px;border-radius:7px;background:var(--soft-2);color:var(--pl);flex:none;
  display:grid;place-items:center;font-size:11.5px;font-family:Archivo,sans-serif;font-weight:700}
.row.mine .num{background:var(--pink);color:#fff}
.nm{flex:1;min-width:0;font-size:14.5px;font-weight:500;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm i{font-style:normal;color:var(--pink);font-size:9px;font-weight:800;margin-left:7px;
  letter-spacing:.12em;font-family:Archivo,sans-serif;vertical-align:1px}
.tag{font-family:Archivo,system-ui,sans-serif;font-size:9.5px;font-weight:700;padding:6px 9px;
  border-radius:6px;flex:none;text-transform:uppercase;letter-spacing:.09em;
  transition:transform .18s var(--ease)}
.tag:active{transform:scale(.93)}
.tag-ok{background:var(--green);color:var(--pl)}
.tag-no{background:var(--soft-2);color:var(--dim)}
.row.mine .tag-no{background:var(--pink);color:#fff}
.x{width:24px;height:24px;border-radius:6px;color:var(--faint);flex:none;font-size:13px;
  transition:color .18s var(--ease),background .18s var(--ease)}
.x:active{background:rgba(233,0,82,.14);color:var(--pink)}
.empty{text-align:center;color:var(--faint);font-size:13.5px;padding:var(--s6) 0;line-height:1.6}

/* ---------- pagamentos ---------- */
.bar{height:8px;border-radius:999px;background:var(--soft-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--green-deep),var(--green));
  transition:width .7s var(--ease)}
.money{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:var(--s3);gap:var(--s3)}
.money .big{font-size:36px;color:var(--pl)}
.money .cap{font-size:12.5px;color:var(--dim);margin-top:3px}
.money .side{font-size:12.5px;color:var(--dim);text-align:right;line-height:1.35}
.money .side b{display:block;font-size:16px;color:var(--ink);font-weight:600}
.copyrow{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);background:var(--soft);
  border-radius:var(--r-md);padding:12px var(--s3);transition:background .18s var(--ease)}
.copyrow+.copyrow{margin-top:var(--s2)}
.copyrow .k{color:var(--faint)}
.copyrow .v{font-size:13.5px;font-weight:600;margin-top:3px;letter-spacing:-.01em}

/* ---------- times ---------- */
.teams{display:grid;gap:var(--s3)}
@media(min-width:520px){.teams{grid-template-columns:repeat(3,1fr)}}
.team{border-radius:var(--r-md);padding:var(--s4);background:var(--soft);
  border-top:4px solid var(--kit,var(--pl));animation:pop .45s var(--ease) both}
.team:nth-child(2){animation-delay:.07s}
.team:nth-child(3){animation-delay:.14s}
.team-h{display:flex;align-items:center;gap:var(--s2);padding-bottom:10px;margin-bottom:10px;
  border-bottom:1px solid var(--line)}
.shirt{width:20px;height:20px;flex:none}
.team-h b{font-family:Archivo,system-ui,sans-serif;font-size:11px;font-weight:800;
  letter-spacing:.11em;text-transform:uppercase;color:var(--pl)}
.team p{font-size:13.5px;padding:5px 0;font-weight:500;letter-spacing:-.01em}
.team p+p{border-top:1px solid rgba(26,0,31,.06)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.rolling .team{animation:none}

/* ---------- organização ---------- */
details.org summary{list-style:none;cursor:pointer;display:flex;align-items:center;
  justify-content:space-between;color:var(--pl)}
details.org summary::-webkit-details-marker{display:none}
details.org[open] summary{margin-bottom:var(--s4)}
details.org summary::after{content:"\25BE";transition:transform .25s var(--ease);font-size:11px}
details.org[open] summary::after{transform:rotate(180deg)}

.note code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
  background:var(--soft-2);padding:2px 6px;border-radius:5px}
.note{font-size:13px;color:var(--ink);background:var(--card);border-left:4px solid var(--pink);
  border-radius:var(--r-md);padding:13px var(--s4);line-height:1.5;box-shadow:var(--shadow);
  animation:rise .5s var(--ease) both}
.foot{text-align:center;font-size:10.5px;color:rgba(255,255,255,.62);padding:var(--s1) 0 var(--s2);
  text-transform:uppercase;letter-spacing:.13em;font-weight:600}
.live{display:inline-flex;align-items:center;gap:7px}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);
  animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--pl);
  color:#fff;font-family:Archivo,system-ui,sans-serif;font-size:11.5px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;padding:13px 22px;border-radius:999px;z-index:9;
  animation:up .3s var(--ease) both;box-shadow:var(--shadow-lg)}
@keyframes up{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
.boot{display:grid;place-items:center;min-height:70dvh;color:rgba(255,255,255,.55);font-size:13px}

/* telemóveis estreitos: aperta as margens para o nome não ser cortado */
@media (max-width:400px){
  .wrap{padding:0 12px}
  .card{padding:var(--s4)}
  .hero{padding:var(--s5) var(--s4) var(--s4)}
  .kick .dnum{font-size:58px}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-delay:0 !important;
    transition-duration:.001ms !important}
}
</style>

<body>
<div id="app"><div class="boot">Carregando a pelada…</div></div>

<script type="module">
import { h, render } from "https://esm.sh/preact@10.19.6";
import { useState, useEffect, useRef, useCallback } from "https://esm.sh/preact@10.19.6/hooks";
import htm from "https://esm.sh/htm@3.1.1";

const html = htm.bind(h);

/* ============================================================
   CONFIGURAÇÃO
   Muda aqui os dados do grupo. Os dois primeiros valores ligam
   o app ao Supabase (Project Settings > API). Enquanto
   estiverem em branco, o app guarda tudo só neste celular —
   funciona, mas não é compartilhado.
   ============================================================ */
const SUPABASE_URL = "https://fvdlajeblaqifjtyezvn.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Qmj4oO4GqM_nA6OxjFqnOA_C67pKCZ0";

const IBAN = "PT50 0007 0000 0658 0592 5323";
const MBWAY = "+351 914 068 950";
const MAPS_LINK = "https://maps.app.goo.gl/aCSuyV77kXDmsYV47?g_st=ic";
const CAMPO = "Ver o campo no mapa";

const DEFAULTS = { kickoff: "10:00", slots: 15, price: 5 };
const ME_KEY = "fdr:me";
const LOCAL_KEY = "fdr:local";

const configured = SUPABASE_URL !== "COLOCAR_AQUI" && SUPABASE_ANON_KEY !== "COLOCAR_AQUI";

// color = cor da camisa, edge = cor da barra do cartão. Separadas porque
// a camisa branca precisa ser branca, mas uma barra branca em cima de
// cartão claro não aparece.
const KITS = [
  { name: "Coletes", color: "#E90052", edge: "#E90052" },
  { name: "Brancos", color: "#FFFFFF", edge: "#04F5FF" },
  { name: "Pretos", color: "#37003C", edge: "#37003C" },
];

/* ---------------- datas ---------------- */
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const today = () => iso(new Date());

function nextSunday(from) {
  const d = from ? new Date(from + "T00:00:00") : new Date();
  const base = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const add = (7 - base.getDay()) % 7;
  base.setDate(base.getDate() + (from ? add || 7 : add));
  return iso(base);
}

const fmt = (d, o) => new Date(d + "T00:00:00").toLocaleDateString("pt-BR", o);
const longDate = (d) => fmt(d, { weekday: "long", day: "numeric", month: "long" });
const weekday = (d) => fmt(d, { weekday: "long" });
const monthName = (d) => fmt(d, { month: "long" });
const dayNum = (d) => new Date(d + "T00:00:00").getDate();

function daysAway(d) {
  const a = new Date(today() + "T00:00:00");
  const b = new Date(d + "T00:00:00");
  return Math.round((b - a) / 86400000);
}
function countdown(d) {
  const n = daysAway(d);
  if (n < 0) return "já passou";
  if (n === 0) return "é hoje";
  if (n === 1) return "é amanhã";
  return `faltam ${n} dias`;
}

const eur = (n) => `${Number(n || 0).toFixed(2).replace(".", ",").replace(",00", "")}€`;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function initials(name) {
  const p = name.trim().split(/\s+/);
  return ((p[0] || "")[0] + (p.length > 1 ? p[p.length - 1][0] : "")).toUpperCase();
}

/* ============================================================
   CAMADA DE DADOS
   Duas implementações com a mesma interface. O app não sabe
   qual está usando — muda só a linha do "store" no final.
   ============================================================ */
function localStore() {
  const read = () => {
    try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || {}; } catch { return {}; }
  };
  const write = (s) => { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(s)); } catch {} };

  return {
    live: false,
    async currentGame() {
      const s = read();
      if (s.game && s.game.game_date >= today()) return s.game;
      const game = { game_date: nextSunday(), ...DEFAULTS, teams: null };
      write({ ...s, game, players: s.game ? [] : s.players || [] });
      return game;
    },
    async saveGame(date, patch) {
      const s = read();
      const game = { ...(s.game || {}), ...patch, game_date: patch.game_date || date };
      if (patch.game_date && patch.game_date !== date) s.players = [];
      write({ ...s, game });
      return game;
    },
    async players() {
      return read().players || [];
    },
    async addPlayer(date, name) {
      const s = read();
      const row = { id: `l${Date.now()}${Math.random().toString(16).slice(2, 6)}`, name, paid: false };
      s.players = [...(s.players || []), row];
      write(s);
      return row;
    },
    async setPaid(id, paid) {
      const s = read();
      s.players = (s.players || []).map((p) => (p.id === id ? { ...p, paid } : p));
      write(s);
    },
    async removePlayer(id) {
      const s = read();
      s.players = (s.players || []).filter((p) => p.id !== id);
      write(s);
    },
    subscribe() { return () => {}; },
  };
}

async function remoteStore() {
  // v2 recente: as chaves novas (sb_publishable_...) não são JWT, e as
  // versões antigas do cliente não lidam bem com elas.
  const { createClient } = await import("https://esm.sh/@supabase/supabase-js@2");
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Verifica que as tabelas existem antes de assumir o Supabase. Sem isto,
  // com o schema.sql por correr, o app parecia funcionar mas não gravava
  // nada: cada gesto dava erro em silêncio e a lista desaparecia ao recarregar.
  const { error: semTabelas } = await sb.from("games").select("game_date").limit(1);
  if (semTabelas) throw new Error(`Supabase sem as tabelas (${semTabelas.message}). Corre o supabase/schema.sql.`);

  return {
    live: true,
    async currentGame() {
      const { data } = await sb.from("games").select("*").gte("game_date", today())
        .order("game_date", { ascending: true }).limit(1);
      if (data && data.length) return data[0];
      const novo = { game_date: nextSunday(), ...DEFAULTS, teams: null };
      const { data: ins } = await sb.from("games").upsert(novo).select().single();
      return ins || novo;
    },
    async saveGame(date, patch) {
      if (patch.game_date && patch.game_date !== date) {
        const { data: existente } = await sb.from("games").select("*").eq("game_date", patch.game_date).maybeSingle();
        if (existente) return existente;
        const { data } = await sb.from("games")
          .upsert({ game_date: patch.game_date, kickoff: patch.kickoff, slots: patch.slots, price: patch.price, teams: null })
          .select().single();
        return data;
      }
      const { data } = await sb.from("games").update({ ...patch, updated_at: new Date().toISOString() })
        .eq("game_date", date).select().single();
      return data;
    },
    async players(date) {
      const { data, error } = await sb.from("players").select("*").eq("game_date", date)
        .order("created_at", { ascending: true });
      if (error) { console.error(error); return []; }
      return data.map((r) => ({ id: r.id, name: r.name, paid: r.paid }));
    },
    async addPlayer(date, name) {
      const { data, error } = await sb.from("players").insert({ game_date: date, name, paid: false }).select().single();
      if (error) { console.error(error); return null; }
      return { id: data.id, name: data.name, paid: data.paid };
    },
    async setPaid(id, paid) {
      const { error } = await sb.from("players").update({ paid }).eq("id", id);
      if (error) console.error(error);
    },
    async removePlayer(id) {
      const { error } = await sb.from("players").delete().eq("id", id);
      if (error) console.error(error);
    },
    subscribe(date, onChange) {
      const ch = sb.channel(`fdr-${date}`)
        .on("postgres_changes", { event: "*", schema: "public", table: "players", filter: `game_date=eq.${date}` }, onChange)
        .on("postgres_changes", { event: "*", schema: "public", table: "games" }, onChange)
        .subscribe();
      return () => sb.removeChannel(ch);
    },
  };
}

/* ============================================================
   PEÇAS VISUAIS
   ============================================================ */
const Pitch = () => html`
  <svg class="pitch" viewBox="0 0 400 220" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g fill="none" stroke="#ffffff" stroke-width="1.6">
      <rect x="8" y="8" width="384" height="204" rx="3" />
      <line x1="200" y1="8" x2="200" y2="212" />
      <circle cx="200" cy="110" r="42" />
      <circle cx="200" cy="110" r="3" fill="#ffffff" stroke="none" />
      <rect x="8" y="55" width="52" height="110" />
      <rect x="340" y="55" width="52" height="110" />
    </g>
  </svg>`;

const Crest = () => html`
  <svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true">
    <path d="M16 2 29 6v10c0 8-6.5 13-13 14C9.5 29 3 24 3 16V6z" fill="none" stroke="#00FF87" stroke-width="2.2" />
    <circle cx="16" cy="15" r="5.5" fill="none" stroke="#00FF87" stroke-width="1.9" />
    <path d="M16 9.5v11M10.5 15h11" stroke="#00FF87" stroke-width="1.9" />
  </svg>`;

const Shirt = ({ color }) => html`
  <svg class="shirt" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M8.5 2 4 4.5 2.5 9l3 1.2V22h13V10.2l3-1.2L20 4.5 15.5 2a3.7 3.7 0 0 1-7 0z"
      fill=${color} stroke="rgba(26,0,31,.4)" stroke-width=".9" />
  </svg>`;

function CopyRow({ k, v, onCopy }) {
  return html`
    <div class="copyrow">
      <div>
        <div class="k lbl">${k}</div>
        <div class="v">${v}</div>
      </div>
      <button class="btn btn-2 btn-s" onClick=${() => onCopy(v, k)}>Copiar</button>
    </div>`;
}

/* ============================================================
   APP
   ============================================================ */
function App({ store }) {
  const [game, setGame] = useState(null);
  const [players, setPlayers] = useState([]);
  const [me, setMe] = useState(() => { try { return JSON.parse(localStorage.getItem(ME_KEY)); } catch { return null; } });
  const [nome, setNome] = useState("");
  const [outro, setOutro] = useState("");
  const [rolling, setRolling] = useState(false);
  const [toast, setToast] = useState("");
  const [busy, setBusy] = useState(false);
  const timer = useRef(null);

  const say = useCallback((m) => {
    setToast(m);
    clearTimeout(timer.current);
    timer.current = setTimeout(() => setToast(""), 1900);
  }, []);

  const refresh = useCallback(async (date) => {
    const rows = await store.players(date);
    setPlayers(rows);
  }, [store]);

  useEffect(() => {
    let alive = true;
    (async () => {
      const g = await store.currentGame();
      if (!alive) return;
      setGame(g);
      const rows = await store.players(g.game_date);
      if (alive) setPlayers(rows);
    })();
    return () => { alive = false; };
  }, [store]);

  useEffect(() => {
    if (!game) return;
    const off = store.subscribe(game.game_date, async () => {
      const g = await store.currentGame();
      setGame(g);
      const rows = await store.players(g.game_date);
      setPlayers(rows);
    });
    return off;
  }, [store, game && game.game_date]);

  if (!game) return html`<div class="boot">Carregando a pelada…</div>`;

  const slots = game.slots || DEFAULTS.slots;
  const price = Number(game.price ?? DEFAULTS.price);
  const titulares = players.slice(0, slots);
  const reservas = players.slice(slots);
  const pagos = players.filter((p) => p.paid);
  const pct = players.length ? Math.round((pagos.length / players.length) * 100) : 0;
  const myRow = me ? players.find((p) => p.id === me.id) : null;
  const myIdx = myRow ? players.findIndex((p) => p.id === me.id) : -1;
  const souReserva = myIdx >= slots;
  const lotado = titulares.length >= slots;

  async function patch(p) {
    const g = await store.saveGame(game.game_date, p);
    if (g) {
      setGame(g);
      if (p.game_date && p.game_date !== game.game_date) refresh(g.game_date);
    }
  }

  async function entrar() {
    const n = nome.trim();
    if (!n || busy) return;
    setBusy(true);
    const row = await store.addPlayer(game.game_date, n);
    setBusy(false);
    if (!row) return say("Não deu para entrar");
    const novo = { id: row.id, name: row.name };
    localStorage.setItem(ME_KEY, JSON.stringify(novo));
    setMe(novo);
    setNome("");
    setPlayers((p) => (p.some((x) => x.id === row.id) ? p : [...p, row]));
    await patch({ teams: null });
    say(players.length >= slots ? "Você ficou de reserva" : "Você está dentro");
  }

  async function adicionar() {
    const n = outro.trim();
    if (!n || busy) return;
    setBusy(true);
    const row = await store.addPlayer(game.game_date, n);
    setBusy(false);
    if (!row) return;
    setOutro("");
    setPlayers((p) => (p.some((x) => x.id === row.id) ? p : [...p, row]));
    await patch({ teams: null });
    say(`${row.name} na lista`);
  }

  async function togglePago(p) {
    const novo = !p.paid;
    setPlayers((l) => l.map((x) => (x.id === p.id ? { ...x, paid: novo } : x)));
    await store.setPaid(p.id, novo);
  }

  async function sair(p) {
    if (!confirm(`Tirar ${p.name} da lista?`)) return;
    setPlayers((l) => l.filter((x) => x.id !== p.id));
    await store.removePlayer(p.id);
    if (me && me.id === p.id) { localStorage.removeItem(ME_KEY); setMe(null); }
    await patch({ teams: null });
  }

  function sortear() {
    if (titulares.length < 3 || rolling) return;
    setRolling(true);
    let t = 0;
    const iv = setInterval(async () => {
      t++;
      const s = shuffle(titulares.map((p) => p.name));
      const prev = [[], [], []];
      s.forEach((n, i) => prev[i % 3].push(n));
      if (t >= 11) {
        clearInterval(iv);
        setRolling(false);
        await patch({ teams: prev });
      } else {
        setGame((g) => ({ ...g, teams: prev }));
      }
    }, 85);
  }

  async function copiar(txt, o) {
    try {
      await navigator.clipboard.writeText(txt);
      say(o ? `${o} copiado` : "Copiado");
    } catch {
      say("Copia na mão, o navegador não deixou");
    }
  }

  function textoWhatsApp() {
    const L = [];
    L.push("*FUTEBOL DE RESPEITO*");
    L.push(`${longDate(game.game_date)} · ${game.kickoff}`);
    L.push(MAPS_LINK);
    L.push("");
    L.push(`*Confirmados (${titulares.length}/${slots})*`);
    titulares.forEach((p, i) => L.push(`${i + 1}. ${p.name} ${p.paid ? "✅" : "⏳"}`));
    if (reservas.length) {
      L.push("");
      L.push("*Reservas*");
      reservas.forEach((p, i) => L.push(`${i + 1}. ${p.name} ${p.paid ? "✅" : "⏳"}`));
    }
    if (game.teams) {
      L.push("");
      L.push("*Times*");
      game.teams.forEach((t, i) => { if (t.length) L.push(`${KITS[i].name}: ${t.join(", ")}`); });
    }
    L.push("");
    L.push(`${eur(price)} cada · ${pagos.length}/${players.length} já pagaram`);
    L.push(`IBAN: ${IBAN}`);
    L.push(`MB Way: ${MBWAY}`);
    L.push("");
    L.push(location.origin);
    return L.join("\n");
  }

  const Linha = (p, i, sub) => html`
    <div class=${`row${me && me.id === p.id ? " mine" : ""}${sub ? " sub" : ""}`} key=${p.id}>
      <span class="num">${i + 1}</span>
      <span class="nm">${p.name}${me && me.id === p.id ? html`<i>VOCÊ</i>` : null}</span>
      <button class=${`tag ${p.paid ? "tag-ok" : "tag-no"}`} onClick=${() => togglePago(p)}>
        ${p.paid ? "Pago" : "Pendente"}
      </button>
      <button class="x" onClick=${() => sair(p)} aria-label="Tirar da lista">✕</button>
    </div>`;

  return html`
    <div class="wrap">

      ${!store.live && html`<div class="note">
        ${configured
          ? html`<b>Falta rodar o SQL.</b> O Supabase está ligado, mas as tabelas ainda não existem,
              então a lista está salva só neste celular. Abre o SQL Editor do Supabase e roda o arquivo <code>supabase/schema.sql</code>.`
          : html`A lista está salva só neste celular. Para todo mundo ver a mesma, liga o Supabase
              (instruções no README).`}
      </div>`}

      <div class="hero">
        <${Pitch} />
        <div class="hero-in">
          <div class="brand"><${Crest} /><b>Futebol de Respeito</b></div>
          <div class="kick">
            <div class="dnum disp">${dayNum(game.game_date)}</div>
            <div class="dtxt">
              <div class="d1">${weekday(game.game_date)}<br />${monthName(game.game_date)}</div>
              <div class="d2">${game.kickoff} · ${countdown(game.game_date)}</div>
            </div>
          </div>
          <div class="hero-foot">
            <a class="pill" href=${MAPS_LINK} target="_blank" rel="noopener noreferrer">\u{1F4CD} ${CAMPO}</a>
            <span class=${`pill${lotado ? " hot" : ""}`}>
              ${lotado ? "Lotado" : `${titulares.length}/${slots} vagas`}
            </span>
            ${reservas.length ? html`<span class="pill">+${reservas.length} ${reservas.length === 1 ? "reserva" : "reservas"}</span>` : null}
          </div>
        </div>
      </div>

      <div class="card">
        ${myRow
          ? html`<div class="me-in">
              <div class="me-badge disp">${initials(myRow.name)}</div>
              <div class="me-txt">
                <b>${myRow.name}</b>
                <span>${souReserva ? `Reserva · ${myIdx - slots + 1}º da fila` : `Confirmado · ${myIdx + 1}º`} · ${myRow.paid ? "pago" : `faltam ${eur(price)}`}</span>
              </div>
              <button class=${`btn btn-s ${myRow.paid ? "btn-g" : "btn-1"}`} onClick=${() => togglePago(myRow)}>
                ${myRow.paid ? "Pago" : "Já paguei"}
              </button>
            </div>`
          : html`<div>
              <div class="card-t lbl" style="margin-bottom:10px">Sua vaga</div>
              <div class="inline">
                <input value=${nome} placeholder="Seu nome"
                  onInput=${(e) => setNome(e.target.value)}
                  onKeyDown=${(e) => e.key === "Enter" && entrar()} />
                <button class="btn btn-1 btn-s" style="padding-inline:20px" disabled=${!nome.trim() || busy}
                  onClick=${entrar}>Entrar</button>
              </div>
            </div>`}
      </div>

      <div class="card">
        <div class="card-h">
          <span class="card-t lbl">Confirmados</span>
          <span class="card-n lbl">${titulares.length}/${slots}</span>
        </div>

        ${players.length === 0
          ? html`<div class="empty">Ninguém ainda.<br />Seja o primeiro a entrar.</div>`
          : html`
            <div>${titulares.map((p, i) => Linha(p, i, false))}</div>
            ${reservas.length
              ? html`<div><div class="sec lbl">Reservas</div>${reservas.map((p, i) => Linha(p, i, true))}</div>`
              : null}
          `}

        <div class="inline" style="margin-top:16px">
          <input value=${outro} placeholder="Adicionar outro jogador"
            onInput=${(e) => setOutro(e.target.value)}
            onKeyDown=${(e) => e.key === "Enter" && adicionar()} />
          <button class="btn btn-g btn-s" style="padding-inline:18px" disabled=${!outro.trim() || busy}
            onClick=${adicionar}>Add</button>
        </div>

        ${players.length > 0 && html`
          <button class="btn btn-2" style="margin-top:8px" onClick=${() => copiar(textoWhatsApp(), "Lista")}>
            Copiar lista pro WhatsApp
          </button>`}
      </div>

      <div class="card">
        <div class="money">
          <div>
            <div class="big disp">${eur(pagos.length * price)}</div>
            <div class="cap">de ${eur(players.length * price)} · ${eur(price)} cada</div>
          </div>
          <div class="side"><b>${pagos.length}/${players.length}</b>pagaram</div>
        </div>
        <div class="bar"><i style=${`width:${pct}%`}></i></div>
        <div style="margin-top:16px">
          <${CopyRow} k="IBAN" v=${IBAN} onCopy=${copiar} />
          <${CopyRow} k="MB Way" v=${MBWAY} onCopy=${copiar} />
        </div>
      </div>

      <div class="card">
        <div class="card-h">
          <span class="card-t lbl">Times</span>
          <button class="btn btn-1 btn-s" disabled=${titulares.length < 3 || rolling} onClick=${sortear}>
            ${rolling ? "Sorteando…" : game.teams ? "Sortear de novo" : "Sortear"}
          </button>
        </div>

        ${titulares.length < 3
          ? html`<div class="empty">Faltam jogadores.<br />Precisa de 3 para dividir os times.</div>`
          : game.teams
            ? html`<div class=${`teams${rolling ? " rolling" : ""}`}>
                ${game.teams.map((t, i) => html`
                  <div class="team" key=${i} style=${`--kit:${KITS[i].edge}`}>
                    <div class="team-h"><${Shirt} color=${KITS[i].color} /><b>${KITS[i].name}</b></div>
                    ${t.length ? t.map((n, j) => html`<p key=${j}>${n}</p>`) : html`<p style="opacity:.5">—</p>`}
                  </div>`)}
              </div>`
            : html`<div class="empty">Sem sorteio ainda.<br />${titulares.length} jogadores prontos.</div>`}
      </div>

      <details class="card org">
        <summary class="lbl">Organização</summary>
        <div class="grid2">
          <div class="field">
            <label class="lbl">Data</label>
            <input type="date" value=${game.game_date} onChange=${(e) => patch({ game_date: e.target.value, kickoff: game.kickoff, slots, price })} />
          </div>
          <div class="field">
            <label class="lbl">Hora</label>
            <input type="time" value=${game.kickoff} onChange=${(e) => patch({ kickoff: e.target.value })} />
          </div>
        </div>
        <div class="grid2">
          <div class="field">
            <label class="lbl">Vagas</label>
            <input type="number" min="3" value=${slots} onChange=${(e) => patch({ slots: Math.max(3, parseInt(e.target.value) || 3), teams: null })} />
          </div>
          <div class="field">
            <label class="lbl">Valor por jogador</label>
            <input type="number" min="0" step="0.5" value=${price} onChange=${(e) => patch({ price: Math.max(0, parseFloat(e.target.value) || 0) })} />
          </div>
        </div>
        <button class="btn btn-g" style="margin-top:16px"
          onClick=${() => confirm("Abrir o jogo do próximo domingo? A lista dele começa vazia.")
            && patch({ game_date: nextSunday(game.game_date), kickoff: game.kickoff, slots, price })}>
          Abrir o próximo domingo
        </button>
        ${me && html`<button class="btn btn-g" style="margin-top:8px"
          onClick=${() => { localStorage.removeItem(ME_KEY); setMe(null); say("Beleza, esqueci quem você é"); }}>
          Não sou mais o ${me.name}
        </button>`}
      </details>

      <div class="foot">
        ${store.live
          ? html`<span class="live">Lista compartilhada, atualiza sozinha</span>`
          : "Salvo só neste celular"}
      </div>
    </div>

    ${toast && html`<div class="toast">${toast}</div>`}
  `;
}

/* ---------------- arranque ---------------- */
(async () => {
  let store;
  try {
    store = configured ? await remoteStore() : localStore();
  } catch (e) {
    console.error("Supabase falhou, usando armazenamento local:", e);
    store = localStore();
  }
  render(h(App, { store }), document.getElementById("app"));
})();
</script>
